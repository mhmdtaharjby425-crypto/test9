/* ---------------- helpers ---------------- */
function addParticle(x, y, vx, vy, life, color, size, grav) {
  Game.particles.push({ x, y, vx, vy, life, max: life, color, size, grav: grav || 0 });
}
function burst(x, y, n, color, spd = 120, size = 3) {
  for (let i = 0; i < n; i++) {
    const a = rand(TAU);
    addParticle(x, y, Math.cos(a) * rand(spd, 20), Math.sin(a) * rand(spd, 20), rand(0.6, 0.25), color, rand(size * 1.6, size * 0.6), 26);
  }
}
function addFloater(x, y, text, color) {
  Game.floaters.push({ x, y, text, color, life: 1.1, max: 1.1 });
}
function noiseAt(world, x, y, radius, source) {
  for (const g of world.guards) {
    if (g.state === 'stunned' || g.state === 'chase') continue;
    const d = dist(g.x, g.y, x, y);
    if (d < radius) {
      g.hearT = 0.3;
      if (g.state !== 'chase') {
        g.state = 'search';
        g.lastSeen = { x, y };
        g.searchT = 3.2;
        g.suspicion = Math.max(g.suspicion, 0.45);
        g.pauseAt = 0;
      }
    }
  }
}

/* ---------------- player ---------------- */
function updatePlayer(dt, world) {
  const p = Game.player;
  const alive = Game.state === 'playing';
  p.invuln = Math.max(0, p.invuln - dt);
  p.throwCooldown = Math.max(0, p.throwCooldown - dt);

  if (p.hidden) {
    p.vx = p.vy = 0;
    p.angle = p.hidingIn ? angLerp(p.angle, p.hidingIn.faceAngle, dt * 8) : p.angle;
    // cam peek: allow looking around a bit
    return;
  }

  let ix = 0, iy = 0;
  if (Input.keys['a'] || Input.keys['arrowleft']) ix -= 1;
  if (Input.keys['d'] || Input.keys['arrowright']) ix += 1;
  if (Input.keys['w'] || Input.keys['arrowup']) iy -= 1;
  if (Input.keys['s'] || Input.keys['arrowdown']) iy += 1;
  if (Input.touch.active) { ix += Input.touch.vx; iy += Input.touch.vy; }

  const mag = Math.hypot(ix, iy);
  if (mag > 1) { ix /= mag; iy /= mag; }
  const hasInput = mag > 0.12;

  p.sneak = !!(Input.keys['shift'] || Input.keys['control'] || Game.touchSneak);
  const wantSprint = (Input.keys[' '] && !p.sneak && hasInput);

  if (wantSprint && p.stamina > 0.06) {
    p.sprinting = true;
    p.stamina = Math.max(0, p.stamina - dt * 0.34);
  } else {
    p.sprinting = false;
    p.stamina = Math.min(1, p.stamina + dt * (p.sneak ? 0.4 : 0.24));
  }

  const base = p.sprinting ? p.sprintSpeed : p.sneak ? p.sneakSpeed : p.speed;
  const spd = base * (p.stamina < 0.05 && p.sprinting ? 0.7 : 1);
  const targetVX = ix * spd, targetVY = iy * spd;
  const accel = hasInput ? 16 : 12;
  p.vx = lerp(p.vx, targetVX, clamp(dt * accel, 0, 1));
  p.vy = lerp(p.vy, targetVY, clamp(dt * accel, 0, 1));

  moveCircle(world, p, p.vx * dt, p.vy * dt, p.radius);

  const sp = Math.hypot(p.vx, p.vy);
  if (sp > 12) {
    p.angle = angLerp(p.angle, Math.atan2(p.vy, p.vx), dt * 14);
    p.walkCycle += dt * sp * 0.055;
    Game.footTimer -= dt * (sp / 150);
    if (Game.footTimer <= 0) {
      Game.footTimer = p.sneak ? 0.44 : p.sprinting ? 0.19 : 0.3;
      if (SFX.inited) SFX.step(p.sprinting);
    }
  }

  // noise radius — emitting pulses while moving
  const noise = p.sneak ? 0 : p.sprinting ? 300 : sp > 25 ? 165 : 0;
  p.noise = noise;
  if (noise > 0 && sp > 30) {
    p.noiseT = (p.noiseT || 0) + dt;
    if (p.noiseT > (p.sprinting ? 0.45 : 0.7)) {
      p.noiseT = 0;
      noiseAt(world, p.x, p.y, noise);
    }
  }

  // auto open nearby doors
  for (const d of world.doors) {
    const dor = Math.hypot(d.cx - p.x, d.cy - p.y);
    if (dor < TILE * 1.25) d.open = true;
  }
}

/* ---------------- guard AI ---------------- */
function updateGuard(g, dt, world) {
  const p = Game.player;
  const cfg = Game.diff;
  g.bob += dt * 3;
  g.hearT = Math.max(0, g.hearT - dt);

  if (g.state === 'stunned') {
    g.stunT -= dt;
    if (g.stunT <= 0) { g.state = 'search'; g.lastSeen = { x: p.x, y: p.y }; g.searchT = 2.2; }
    return;
  }

  const seenNow = !p.hidden && Game.state === 'playing' && p.invuln <= 0 && canSee(world, g, p, cfg.sight, 1);
  if (seenNow) {
    const d = dist(g.x, g.y, p.x, p.y);
    g.suspicion = Math.min(1, g.suspicion + dt * (d < 130 ? 4.2 : 2.2));
    g.lastSeen = { x: p.x, y: p.y };
    g.lostT = 0;
    if (g.suspicion > 0.42) {
      if (g.state !== 'chase') { g.state = 'chase'; SFX.alarmOn(); }
      Game.alertLevel = Math.min(1, Game.alertLevel + dt * 0.15);
    }
  } else {
    g.suspicion = Math.max(0, g.suspicion - dt * 0.42);
    g.lostT += dt;
  }

  /* ---- behavior ---- */
  let moveSpeed = g.speed * cfg.speed;
  if (g.state === 'patrol') {
    moveSpeed *= 0.72;
    if (g.waitT > 0) {
      g.waitT -= dt;
      const next = g.route[(g.routeIdx + 1) % g.route.length];
      const na = Math.atan2(next.ty * TILE + 20 - g.y, next.tx * TILE + 20 - g.x);
      g.angle = angLerp(g.angle, na, dt * 2.4);
      // slow head scanning while idle
      g.angle += Math.sin(g.bob * 0.7) * dt * 0.5;
    } else {
      const wp = g.route[g.routeIdx];
      const tx = wp.tx * TILE + TILE / 2, ty = wp.ty * TILE + TILE / 2;
      if (dist(g.x, g.y, tx, ty) < 14) {
        g.routeIdx = (g.routeIdx + 1) % g.route.length;
        g.waitT = rand(1.25, 0.35);
      } else {
        steerTo(g, tx, ty, dt, moveSpeed, world);
      }
    }
  } else if (g.state === 'search') {
    moveSpeed *= 0.86;
    g.searchT = (g.searchT || 0) - dt;
    if (g.lastSeen) {
      const d = dist(g.x, g.y, g.lastSeen.x, g.lastSeen.y);
      if (d > 22) steerTo(g, g.lastSeen.x, g.lastSeen.y, dt, moveSpeed, world);
      else {
        g.angle += dt * 2.6;
      }
    }
    if (g.searchT <= 0) { g.state = 'patrol'; g.suspicion = 0; g.lastSeen = null; }
  } else if (g.state === 'chase') {
    moveSpeed *= 1.42;
    const tgt = p.hidden ? null : p;
    if (tgt) {
      steerTo(g, tgt.x, tgt.y, dt, moveSpeed, world);
      Game.alertLevel = Math.min(1, Game.alertLevel + dt * 0.1);
    }
    if (g.lostT > 2.4 * cfg.memory || p.hidden) {
      g.state = 'search';
      g.searchT = 3.4;
      g.lastSeen = g.lastSeen || { x: p.x, y: p.y };
    }
  }

  // catch: a guard who has spotted you grabs you at close range
  if (!p.hidden && Game.state === 'playing' && p.invuln <= 0) {
    const d = dist(g.x, g.y, p.x, p.y);
    if (d < 24 && (g.state === 'chase' || g.suspicion > 0.55)) {
      onCaught('دستگیر شدی!');
    }
  }

  // opening doors they touch
  for (const d of world.doors) {
    if (Math.hypot(d.cx - g.x, d.cy - g.y) < TILE * 1.2) d.guards = 2;
  }
}

function steerTo(g, tx, ty, dt, speed, world) {
  const dx = tx - g.x, dy = ty - g.y;
  const d = Math.hypot(dx, dy);
  if (d < 2) return;
  // direct if LOS clear
  let ux = dx / d, uy = dy / d;
  if (!hasLOS(world, g.x, g.y, tx, ty)) {
    g.repathT -= dt;
    if (g.repathT <= 0 || !g.path.length) {
      g.repathT = 0.35;
      const path = findPath(world, Math.floor(g.x / TILE), Math.floor(g.y / TILE), Math.floor(tx / TILE), Math.floor(ty / TILE));
      g.path = path || [];
      g.pathIdx = 0;
    }
    if (g.path.length) {
      while (g.pathIdx < g.path.length - 1) {
        const [px, py] = g.path[g.pathIdx];
        if (dist(g.x, g.y, px * TILE + TILE / 2, py * TILE + TILE / 2) < 12) g.pathIdx++;
        else break;
      }
      const [px, py] = g.path[Math.min(g.pathIdx, g.path.length - 1)];
      const ax = px * TILE + TILE / 2 - g.x, ay = py * TILE + TILE / 2 - g.y;
      const ad = Math.hypot(ax, ay) || 1;
      ux = ax / ad; uy = ay / ad;
    }
  }
  const beforeX = g.x, beforeY = g.y;
  const step = speed * dt;
  moveCircle(world, g, ux * step, uy * step, g.radius);
  g.angle = angLerp(g.angle, Math.atan2(uy, ux), clamp(dt * 7, 0, 1));

  // unstick: if blocked for a while, sidestep and repath
  if (dist(g.x, g.y, beforeX, beforeY) < step * 0.25) {
    g.stuckT = (g.stuckT || 0) + dt;
    if (g.stuckT > 0.55) {
      g.stuckT = 0;
      g.path = []; g.repathT = 0;
      const side = Math.random() < 0.5 ? 1 : -1;
      moveCircle(world, g, -uy * step * 3 * side, ux * step * 3 * side, g.radius);
      if (g.state === 'patrol') { g.routeIdx = (g.routeIdx + 1) % g.route.length; g.waitT = rand(1.4, 0.3); }
    }
  } else g.stuckT = 0;
}

/* ---------------- cameras ---------------- */
function updateCamera(c, dt, world) {
  if (!world.powerOn) { c.alert = Math.max(0, c.alert - dt * 2); return; }
  c.sweep += dt * c.sweepSpeed;
  const base = c.baseAngle;
  c.angle = base + Math.sin(c.sweep) * 0.85;
  c.spotted = false;
  const p = Game.player;
  if (!p.hidden && Game.state === 'playing' && p.invuln <= 0) {
    const dx = p.x - c.x, dy = p.y - c.y;
    const d = Math.hypot(dx, dy);
    if (d < c.range) {
      const a = Math.atan2(dy, dx);
      if (Math.abs(norm(a - c.angle)) < c.fov && hasLOS(world, c.x, c.y, p.x, p.y)) {
        c.spotted = true;
        c.alert = Math.min(1, c.alert + dt * 1.6);
        Game.alertLevel = Math.min(1, Game.alertLevel + dt * 0.34);
        // camera calls guards
        for (const g of world.guards) {
          if (g.state !== 'chase') {
            g.state = 'search'; g.lastSeen = { x: p.x, y: p.y }; g.searchT = 3; g.suspicion = Math.max(g.suspicion, 0.5);
          }
        }
      } else c.alert = Math.max(0, c.alert - dt * 0.9);
    } else c.alert = Math.max(0, c.alert - dt * 0.9);
  }
}

/* ============================================================
   INTERACTIONS
   ============================================================ */
function nearestInteractable(world) {
  const p = Game.player;
  if (p.hidden) return { kind: 'unhide' };
  let best = null, bestD = 46;
  for (const l of world.lockers) {
    const d = dist(p.x, p.y, l.x, l.y);
    if (d < bestD) { bestD = d; best = { kind: 'hide', obj: l, d }; }
  }
  for (const s of world.switches) {
    if (!s.on) continue;
    const d = dist(p.x, p.y, s.x, s.y);
    if (d < bestD) { bestD = d; best = { kind: 'switch', obj: s, d }; }
  }
  for (const ex of world.exits) {
    const d = dist(p.x, p.y, ex.standX, ex.standY);
    if (d < TILE * 0.95) { bestD = Math.min(bestD, d); best = { kind: 'exit', obj: ex, d }; }
  }
  return best;
}

function doInteract() {
  if (Game.state !== 'playing') return;
  const world = Game.world, p = Game.player;
  const it = nearestInteractable(world);
  if (!it) return;

  if (it.kind === 'hide') {
    p.hidden = true;
    p.hidingIn = it.obj;
    it.obj.open = true;
    p.x = it.obj.x; p.y = it.obj.y;
    it.obj.faceAngle = p.angle;
    SFX.hide();
    toast('در کمد پنهان شدی — نگهبان‌ها نمی‌بینندت', 'info');
  } else if (it.kind === 'unhide') {
    p.hidden = false;
    if (p.hidingIn) p.hidingIn.open = false;
    p.hidingIn = null;
    p.x += Math.cos(p.angle) * 0 + 2; // nudge out
    SFX.hide();
    toast('از کمد بیرون آمدی', 'info');
  } else if (it.kind === 'switch') {
    it.obj.on = false;
    it.obj.press = 1;
    world.powerOn = false;
    world.cameras.forEach(c => { c.alert = 0; c.spotted = false; });
    burst(it.obj.x, it.obj.y, 22, '#8fe3ff', 200, 3);
    SFX.switchOn();
    completeObjective('power');
    toast('برق سیستم امنیتی قطع شد — دوربین‌ها خاموش شدند', 'good');
    addFloater(it.obj.x, it.obj.y - 26, '- برق', '#8fe3ff');
  } else if (it.kind === 'exit') {
    if (!Game.hasKeycard) {
      SFX.locked();
      toast('دروازه قفل است — کارت دسترسی لازم داری', 'warn');
    } else if (world.powerOn) {
      SFX.locked();
      toast('دروازه با برق قفل شده — اول برق را قطع کن', 'warn');
    } else {
      levelComplete();
    }
  }
}

function throwCan() {
  if (Game.state !== 'playing') return;
  const p = Game.player;
  if (p.hidden) return;
  if (p.throwCooldown > 0) return;
  if (Game.cans <= 0) { toast('کنسرویی نداری — از محیط پیدا کن', 'warn'); SFX.locked(); return; }
  Game.cans--;
  p.throwCooldown = 0.45;
  let a = p.angle;
  if (Input.mouse.active) {
    const wm = screenToWorld(Input.mouse.x, Input.mouse.y);
    a = Math.atan2(wm.y - p.y, wm.x - p.x);
  }
  Game.projectiles.push({
    x: p.x, y: p.y, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520,
    life: 0.9, spin: 0, angle: a
  });
  SFX.throwCan();
  syncHud();
}

function updateProjectiles(dt) {
  const world = Game.world;
  for (let i = Game.projectiles.length - 1; i >= 0; i--) {
    const pr = Game.projectiles[i];
    pr.life -= dt;
    pr.spin += dt * 22;
    const nx = pr.x + pr.vx * dt, ny = pr.y + pr.vy * dt;
    const hit = solidAtPoint(world, nx, ny);
    pr.x = nx; pr.y = ny;
    pr.vx *= 0.995; pr.vy *= 0.995;
    if (hit || pr.life <= 0) {
      const ix = pr.x - pr.vx * dt, iy = pr.y - pr.vy * dt;
      Game.projectiles.splice(i, 1);
      SFX.land();
      burst(hit ? ix : pr.x, hit ? iy : pr.y, 10, '#ffd28a', 90, 2);
      const nx2 = hit ? ix : pr.x, ny2 = hit ? iy : pr.y;
      noiseAt(world, nx2, ny2, 330);
      Game.ringOut = Game.ringOut || [];
      Game.ringOut.push({ x: nx2, y: ny2, r: 0, life: 0.75, max: 0.75 });
    }
  }
}

/* ============================================================
   OBJECTIVES / FAIL / WIN
   ============================================================ */
function completeObjective(id) {
  const o = Game.objectives.find(x => x.id === id);
  if (o && !o.done) {
    o.done = true;
    syncHud();
    SFX.pickup();
    const idx = Game.objectives.indexOf(o);
    if (idx >= 0) addFloater(Game.player.x, Game.player.y - 34, '✓', '#3ee2a0');
  }
}

function onCaught(reason) {
  if (Game.state !== 'playing') return;
  Game.state = 'caught';
  Game.lives--;
  Game.stats.caught++;
  Game.caughtFlash = 1;
  Game.camShake = 16;
  SFX.caught();
  if (SFX.inited) SFX.alarmOn();
  if (navigator.vibrate) navigator.vibrate([60, 50, 90]);
  world_caught_reason = reason;
  setTimeout(() => {
    if (Game.lives <= 0) { Game.state = 'gameover'; showGameOver(reason); }
    else { respawn(); }
  }, 1150);
  syncHud();
}
let world_caught_reason = '';

function respawn() {
  const world = Game.world;
  const p = Game.player;
  p.x = world.spawn.x; p.y = world.spawn.y;
  p.vx = p.vy = 0; p.hidden = false; p.hidingIn = null;
  p.invuln = 2.2; p.stamina = 1;
  world.guards.forEach(g => {
    g.state = 'patrol'; g.suspicion = 0; g.lastSeen = null; g.path = [];
    g.x = g.spawnX; g.y = g.spawnY; g.routeIdx = 0; g.waitT = 1.2;
  });
  Game.alarm = 0; Game.alertLevel = 0;
  Game.state = 'playing';
  Game.introT = 0;
  positionCamera(true);
  toast('از سلول شروع دوباره — ' + Game.lives + ' جان باقی مانده', 'info');
  syncHud();
}

function levelComplete() {
  Game.state = 'levelclear';
  Game.stats.levels++;
  SFX.win();
  const t = Game.levelTime;
  const stars = t < 150 && Game.stats.caught === 0 ? 3 : t < 260 ? 2 : 1;
  Game.levelStars = stars;
  const final = Game.levelIndex >= LEVELS.length - 1;
  setTimeout(() => showLevelClear(final, stars, t), 550);
  syncHud();
}

/* ============================================================
   MAIN TICK
   ============================================================ */
function update(dt) {
  Game.time += dt;
  const world = Game.world;

  if (Game.state === 'playing') {
    Game.levelTime += dt;
    Game.introT = Math.max(0, Game.introT - dt);
    updatePlayer(dt, world);
    for (const g of world.guards) updateGuard(g, dt, world);
    for (const c of world.cameras) updateCamera(c, dt, world);
    updateProjectiles(dt);

    // door animation & closing
    for (const d of world.doors) {
      d.guards = Math.max(0, d.guards - dt * 2);
      if (d.guards > 0) d.holdT = 0.5;
      const p = Game.player;
      if (!p.hidden && Math.hypot(d.cx - p.x, d.cy - p.y) < TILE * 1.05) d.holdT = 0.55;
      d.holdT = Math.max(0, (d.holdT || 0) - dt);
      d.open = d.guards > 0 || d.holdT > 0;
      d.anim = clamp(d.anim + (d.open ? dt * 5 : -dt * 2.4), 0, 1);
    }

    // pickups
    for (const it of world.pickups) {
      it.t += dt * 3;
      if (it.taken) continue;
      if (dist(Game.player.x, Game.player.y, it.x, it.y) < 26 && !Game.player.hidden) {
        it.taken = true;
        if (it.kind === 'card') {
          Game.hasKeycard = true;
          completeObjective('card');
          toast('کارت دسترسی برداشته شد', 'good');
          addFloater(it.x, it.y - 20, '+ کارت دسترسی', '#ffd9a0');
        } else {
          Game.cans++;
          toast('کنسرو برداشته شد (+۱ پرتاب)', 'good');
          addFloater(it.x, it.y - 20, '+ کنسرو', '#ffd9a0');
          syncHud();
        }
        SFX.pickup();
        burst(it.x, it.y, 16, it.kind === 'card' ? '#ffcf7a' : '#bfe9ff', 130, 2.4);
      }
    }

    // switch press animation
    for (const s of world.switches) s.press = Math.max(0, s.press - dt * 2);

    // alarm logic
    const anyChase = world.guards.some(g => g.state === 'chase');
    const spotted = world.cameras.some(c => c.spotted);
    if (anyChase) Game.alarm = Math.min(1, Game.alarm + dt * 0.115 * Game.diff.drain);
    else if (spotted) Game.alarm = Math.min(1, Game.alarm + dt * 0.055 * Game.diff.drain);
    else Game.alarm = Math.max(0, Game.alarm - dt * 0.14 / Math.max(0.6, Game.diff.drain));
    if (Game.alarm >= 0.999) onCaught('زنگ خطر به صدا درآمد!');

    // interaction prompt
    updatePrompt();

    // escape check (walking onto exit tile)
    for (const ex of world.exits) {
      if (dist(Game.player.x, Game.player.y, ex.standX, ex.standY) < TILE * 0.8 && !Game.player.hidden) {
        if (Game.hasKeycard && !world.powerOn) levelComplete();
        break;
      }
    }

    Game.playTime += dt;
  }

  // particles / floaters always animate
  for (let i = Game.particles.length - 1; i >= 0; i--) {
    const q = Game.particles[i];
    q.life -= dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vy += q.grav * dt;
    q.vx *= 0.96; q.vy *= 0.96;
    if (q.life <= 0) Game.particles.splice(i, 1);
  }
  for (let i = Game.floaters.length - 1; i >= 0; i--) {
    const f = Game.floaters[i];
    f.life -= dt; f.y -= dt * 26;
    if (f.life <= 0) Game.floaters.splice(i, 1);
  }
  if (Game.ringOut) {
    for (let i = Game.ringOut.length - 1; i >= 0; i--) {
      const r = Game.ringOut[i];
      r.life -= dt; r.r += dt * 300;
      if (r.life <= 0) Game.ringOut.splice(i, 1);
    }
  }

  Game.caughtFlash = Math.max(0, Game.caughtFlash - dt * 1.6);
  Game.camShake = Math.max(0, Game.camShake - dt * 34);
  Game.transition = Math.max(0, Game.transition - dt * 1.6);

  // camera follow
  positionCamera(false, dt);

  // hud timers
  Game.hudTick = (Game.hudTick || 0) + dt;
  if (Game.hudTick > 0.1) { Game.hudTick = 0; updateHudDynamic(); }
}

/* ---------------- camera ---------------- */
function positionCamera(snap, dt) {
  const p = Game.player;
  if (!p) return;
  const world = Game.world;
  const targetZoom = computeZoom();
  const c = Game.cam;
  if (snap) {
    c.x = p.x; c.y = p.y; c.zoom = targetZoom;
  } else {
    const k = clamp((dt || 0.016) * 6.5, 0, 1);
    c.x = lerp(c.x, p.x + Math.cos(p.angle) * 12, k);
    c.y = lerp(c.y, p.y + Math.sin(p.angle) * 12, k);
    c.zoom = lerp(c.zoom, targetZoom, clamp((dt || 0.016) * 4, 0, 1));
  }
  // clamp to world
  const halfW = Game.vw / 2 / c.zoom, halfH = Game.vh / 2 / c.zoom;
  if (world.W2 > halfW * 2) c.x = clamp(c.x, halfW, world.W2 - halfW); else c.x = world.W2 / 2;
  if (world.H2 > halfH * 2) c.y = clamp(c.y, halfH, world.H2 - halfH); else c.y = world.H2 / 2;
}

function computeZoom() {
  const world = Game.world;
  if (!world) return 1;
  const base = Math.min(Game.vw / (world.W2 * 0.92), Game.vh / (world.H2 * 0.92));
  const minReadable = Math.min(Game.vw, Game.vh) / 560;
  return clamp(Math.max(base, minReadable), 0.42, 1.55) * (Game.isTouch ? 0.92 : 1);
}

function screenToWorld(sx, sy) {
  const c = Game.cam;
  return { x: (sx - Game.vw / 2) / c.zoom + c.x, y: (sy - Game.vh / 2) / c.zoom + c.y };
}

/* ============ 50-render.js ============ */
/* ============================================================
   RENDER
   ============================================================ */
let bgCanvas = null, lightCanvas = null;

function setupCanvases() {
  const cv = document.getElementById('game');
  Game.canvas = cv;
  Game.ctx = cv.getContext('2d');
  resize();
  addEventListener('resize', resize);
}

function resize() {
  const cv = Game.canvas;
  Game.dpr = Math.min(devicePixelRatio || 1, 2);
  Game.vw = innerWidth; Game.vh = innerHeight;
  cv.width = Math.floor(innerWidth * Game.dpr);
  cv.height = Math.floor(innerHeight * Game.dpr);
  cv.style.width = innerWidth + 'px';
  cv.style.height = innerHeight + 'px';
  Game.isTouch = matchMedia('(pointer:coarse)').matches || innerWidth < 820;
  document.body.classList.toggle('touch', Game.isTouch);
  if (Game.world) { positionCamera(true); renderStatic(); }
}

function renderStatic() {
  const world = Game.world;
  if (!world) return;
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = world.W2; bgCanvas.height = world.H2;
  const ctx = bgCanvas.getContext('2d');
  drawFloor(ctx, world);
  drawWalls(ctx, world);
  drawDecor(ctx, world);
}

/* ---------------- floor ---------------- */
function drawFloor(ctx, world) {
  const W = world.W, H = world.H;
  const pal = [
    { a: [58, 69, 86], b: [46, 56, 72], line: 'rgba(180,205,235,.09)' },
    { a: [52, 63, 84], b: [42, 52, 70], line: 'rgba(175,205,240,.10)' },
    { a: [56, 66, 68], b: [44, 54, 57], line: 'rgba(170,205,195,.09)' }
  ][world.index % 3];

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const t = world.grid[y][x];
      if (t.type === 'wall' || t.type === 'gate') continue;
      const X = x * TILE, Y = y * TILE;
      const v = t.v, v2 = h2(x, y, 3);
      ctx.fillStyle = `rgb(${Math.round(pal.a[0] + v * 10)},${Math.round(pal.a[1] + v2 * 8)},${Math.round(pal.a[2] + v * 12)})`;
      ctx.fillRect(X, Y, TILE, TILE);

      // tile grout
      ctx.strokeStyle = pal.line;
      ctx.lineWidth = 1;
      ctx.strokeRect(X + 0.5, Y + 0.5, TILE - 1, TILE - 1);

      // subtle checker for tiled floors
      if ((x + y) % 2 === 0) {
        ctx.fillStyle = 'rgba(255,255,255,.022)';
        ctx.fillRect(X, Y, TILE, TILE);
      }
      // scuffs & stains
      if (v > 0.86) {
        ctx.fillStyle = `rgba(0,0,0,${0.08 + v2 * 0.1})`;
        ctx.beginPath();
        ctx.ellipse(X + v * TILE, Y + v2 * TILE, 7 + v2 * 12, 4 + v * 7, v2 * 3, 0, TAU);
        ctx.fill();
      }
      if (v2 > 0.93) {
        ctx.fillStyle = 'rgba(200,225,255,.06)';
        ctx.fillRect(X + v * 30, Y + v2 * 30, 2, 12);
      }
    }
  }

  // painted walkway lines in corridors (visual interest)
  ctx.save();
  ctx.globalAlpha = 0.14;
  ctx.strokeStyle = '#7fd8ff';
  ctx.lineWidth = 3;
  ctx.setLineDash([16, 14]);
  for (let y = 0; y < H; y++) {
    let runStart = -1;
    for (let x = 0; x <= W; x++) {
      const ok = x < W && world.grid[y][x].type === 'floor' && world.grid[y][x].ch === '.';
      const walk = ok && y > 0 && y < H - 1 && world.grid[y - 1][x].type === 'wall';
      if (ok && runStart < 0) runStart = x;
      if (!ok && runStart >= 0) {
        if (x - runStart > 4) {
          ctx.beginPath();
          ctx.moveTo(runStart * TILE + 14, y * TILE + TILE - 9);
          ctx.lineTo(x * TILE - 14, y * TILE + TILE - 9);
          ctx.stroke();
        }
        runStart = -1;
      }
    }
  }
  ctx.restore();
}

/* ---------------- walls ---------------- */
function drawWalls(ctx, world) {
  const W = world.W, H = world.H;
  const pal = [
    { face: '#3f4c64', top: '#586a89', edge: '#6c80a4', deep: '#141b28' },
    { face: '#3c4760', top: '#54637f', edge: '#67799b', deep: '#131a26' },
    { face: '#374252', top: '#4b586c', edge: '#5d6b80', deep: '#121821' }
  ][world.index % 3];

  // drop shadow under walls
  ctx.save();
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (world.grid[y][x].type !== 'wall') continue;
    const X = x * TILE, Y = y * TILE;
    const g = ctx.createLinearGradient(X, Y + TILE, X, Y + TILE + 16);
    g.addColorStop(0, 'rgba(0,0,0,.42)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    const below = world.grid[y + 1] && world.grid[y + 1][x];
    if (!below || below.type !== 'wall') ctx.fillRect(X, Y + TILE, TILE, 16);
  }
  ctx.restore();

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const t = world.grid[y][x];
      if (t.type !== 'wall' && t.type !== 'gate') continue;
      const X = x * TILE, Y = y * TILE;
      const up = world.grid[y - 1]?.[x], dn = world.grid[y + 1]?.[x];
      const lf = world.grid[y][x - 1], rt = world.grid[y][x + 1];
      const isW = o => o && (o.type === 'wall' || o.type === 'gate');
      const isUp = !isW(up), isDn = !isW(dn), isLf = !isW(lf), isRt = !isW(rt);

      const v = t.v;
      // base
      const g = ctx.createLinearGradient(X, Y, X, Y + TILE);
      g.addColorStop(0, pal.top);
      g.addColorStop(1, pal.face);
      ctx.fillStyle = g;
      ctx.fillRect(X, Y, TILE, TILE);

      // brick texture
      ctx.save();
      ctx.beginPath(); ctx.rect(X, Y, TILE, TILE); ctx.clip();
      ctx.strokeStyle = 'rgba(0,0,0,.17)';
      ctx.lineWidth = 1;
      const rows = 4;
      for (let r = 0; r < rows; r++) {
        const yy = Y + (r + 1) * TILE / rows;
        ctx.beginPath(); ctx.moveTo(X, yy + 0.5); ctx.lineTo(X + TILE, yy + 0.5); ctx.stroke();
        const off = r % 2 ? TILE / 2 : 0;
        for (let c = 0; c < 3; c++) {
          const xx = X + off + c * TILE / 2;
          if (xx > X && xx < X + TILE) {
            ctx.beginPath(); ctx.moveTo(xx + 0.5, yy); ctx.lineTo(xx + 0.5, yy - TILE / rows); ctx.stroke();
          }
        }
      }
      // highlight speckle
      ctx.fillStyle = `rgba(255,255,255,${0.035 + v * 0.05})`;
      ctx.fillRect(X, Y, TILE, 3);
      if (v > 0.8) {
        ctx.fillStyle = 'rgba(0,0,0,.16)';
        ctx.beginPath(); ctx.ellipse(X + v * TILE, Y + TILE * 0.7, 11, 7, 0.4, 0, TAU); ctx.fill();
      }
      ctx.restore();

      // 3d bevel edges
      if (isUp) {
        const gg = ctx.createLinearGradient(X, Y, X, Y + 8);
        gg.addColorStop(0, 'rgba(255,255,255,.16)');
        gg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gg; ctx.fillRect(X, Y, TILE, 8);
      }
      if (isDn) {
        const gg = ctx.createLinearGradient(X, Y + TILE, X, Y + TILE - 12);
        gg.addColorStop(0, 'rgba(0,0,0,.55)');
        gg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gg; ctx.fillRect(X, Y + TILE - 12, TILE, 12);
      }
      if (isLf) { ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.fillRect(X, Y, 3, TILE); }
      if (isRt) { ctx.fillStyle = 'rgba(0,0,0,.26)'; ctx.fillRect(X + TILE - 3, Y, 3, TILE); }
      if (isUp) { ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(X, Y, TILE, 2); }
    }
  }
}

/* ---------------- decorative props baked into bg ---------------- */
function drawDecor(ctx, world) {
  // floor grates
  for (let y = 0; y < world.H; y++) for (let x = 0; x < world.W; x++) {
    const t = world.grid[y][x];
    if (t.type === 'wall') continue;
    if (h2(x, y, 11) > 0.94) {
      const X = x * TILE + 10, Y = y * TILE + 10;
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.fillRect(X, Y, 20, 20);
      ctx.strokeStyle = 'rgba(150,180,215,.28)';
      ctx.lineWidth = 1.4;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath(); ctx.moveTo(X + 3 + i * 5, Y + 2); ctx.lineTo(X + 3 + i * 5, Y + 18); ctx.stroke();
      }
      ctx.restore();
    }
    // caution stripe near doors
    if (t.ch === '.' && h2(x, y, 23) > 0.965) {
      ctx.save();
      ctx.globalAlpha = 0.16;
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = i % 2 ? '#ffb347' : '#12161f';
        ctx.fillRect(x * TILE + i * 8, y * TILE + TILE - 6, 8, 4);
      }
      ctx.restore();
    }
  }
  // wall-mounted pipes along top walls
  for (let y = 0; y < world.H; y++) {
    for (let x = 0; x < world.W; x++) {
      if (world.grid[y][x].type !== 'wall') continue;
      const dn = world.grid[y + 1]?.[x];
      if (dn && dn.type === 'floor' && h2(x, y, 41) > 0.55) {
        ctx.save();
        ctx.strokeStyle = 'rgba(120,140,170,.4)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x * TILE + 4, y * TILE + TILE - 5);
        ctx.lineTo(x * TILE + TILE - 4, y * TILE + TILE - 5);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,.10)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(x * TILE + 4, y * TILE + TILE - 7);
        ctx.lineTo(x * TILE + TILE - 4, y * TILE + TILE - 7);
        ctx.stroke();
        ctx.restore();
      }
    }
  }
}

/* ============================================================
   /main/ render frame
   ============================================================ */
function render() {
  const ctx = Game.ctx, world = Game.world;
  if (!ctx) return;
  const dpr = Game.dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, Game.vw, Game.vh);

  if (!world) { drawMenuBackdrop(ctx); return; }

  const cam = Game.cam;
  const shakeX = Game.camShake ? rand(Game.camShake, -Game.camShake) : 0;
  const shakeY = Game.camShake ? rand(Game.camShake, -Game.camShake) : 0;

  ctx.save();
  ctx.translate(Game.vw / 2 + shakeX, Game.vh / 2 + shakeY);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);

  // background (pre-rendered)
  if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0);

  // pulsing lamp pools on floor
  const t = Game.time;
  for (const l of world.lamps) {
    const pulse = 0.5 + Math.sin(t * 1.6 + l.p) * 0.5;
    const grd = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r);
    grd.addColorStop(0, `rgba(255,206,140,${0.1 + pulse * 0.05})`);
    grd.addColorStop(1, 'rgba(255,206,140,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(l.x, l.y, l.r, 0, TAU); ctx.fill();
  }

  // exits (gate)
  for (const ex of world.exits) drawExit(ctx, ex, world);

  // lockers
  for (const l of world.lockers) drawLocker(ctx, l);

  // switches
  for (const s of world.switches) drawSwitch(ctx, s);

  // pickups
  for (const it of world.pickups) {
    if (it.taken) continue;
    drawPickup(ctx, it, t);
  }

  // boxes
  for (const b of world.boxes) drawBox(ctx, b);

  // doors
  for (const d of world.doors) drawDoor(ctx, d);

  // vision cones (floor overlay)
  for (const g of world.guards) drawVisionCone(ctx, g, '#ffcf6b', g.state === 'chase' ? '#ff5566' : null);
  for (const c of world.cameras) drawCamCone(ctx, c);

  // projectiles & rings
  if (Game.ringOut) for (const r of Game.ringOut) {
    ctx.strokeStyle = `rgba(255,220,150,${r.life / r.max * 0.7})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
  for (const pr of Game.projectiles) drawCan(ctx, pr);

  // guards
  for (const g of world.guards) drawGuard(ctx, g);

  // player
  if (Game.player) drawPlayer(ctx, Game.player);

  // stamina ring (only when it matters)
  if (Game.player && !Game.player.hidden && Game.player.stamina < 0.995) {
    const p = Game.player;
    const a0 = -Math.PI / 2;
    const col = p.stamina < 0.25 ? 'rgba(255,110,120,.9)' : p.stamina < 0.6 ? 'rgba(255,196,90,.85)' : 'rgba(140,235,190,.75)';
    ctx.save();
    ctx.strokeStyle = 'rgba(8,14,22,.55)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(p.x, p.y, 26, 0, TAU); ctx.stroke();
    ctx.strokeStyle = col;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(p.x, p.y, 26, a0, a0 + TAU * p.stamina); ctx.stroke();
    ctx.restore();
  }

  // particles
  for (const q of Game.particles) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.color;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.size * (q.life / q.max), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // floaters
  for (const f of Game.floaters) {
    ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
    ctx.fillStyle = f.color;
    ctx.font = 'bold 14px "Vazirmatn",Tahoma,sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 8;
    ctx.fillText(f.text, f.x, f.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';

  ctx.restore();

  // darkness + vignette + alert tint
  drawLighting(ctx, world);
  drawVignette(ctx);

  if (Game.caughtFlash > 0) {
    ctx.fillStyle = `rgba(255,40,60,${Game.caughtFlash * 0.42})`;
    ctx.fillRect(0, 0, Game.vw, Game.vh);
  }
  if (Game.alarm > 0.35) {
    const a = (Game.alarm - 0.35) / 0.65 * (0.5 + Math.sin(t * 6) * 0.5);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const grd = ctx.createRadialGradient(Game.vw / 2, Game.vh / 2, Math.min(Game.vw, Game.vh) * 0.28,
      Game.vw / 2, Game.vh / 2, Math.max(Game.vw, Game.vh) * 0.72);
    grd.addColorStop(0, `rgba(255,20,40,0)`);
    grd.addColorStop(1, `rgba(255,20,40,${a * 0.28})`);
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, Game.vw, Game.vh);
    ctx.restore();
  }

  // intro banner fade
  if (Game.introT > 0 && Game.state === 'playing') {
    const k = clamp(Game.introT / 0.6, 0, 1);
    ctx.fillStyle = `rgba(3,6,12,${k * 0.92})`;
    ctx.fillRect(0, 0, Game.vw, Game.vh);
  }
  if (Game.transition > 0) {
    ctx.fillStyle = `rgba(2,4,9,${Game.transition})`;
    ctx.fillRect(0, 0, Game.vw, Game.vh);
  }
}

/* ---------------- lighting ---------------- */
function drawLighting(ctx, world) {
  const p = Game.player;
  if (!p) return;
  const c = Game.cam;
  const vis = world.def.vision || 1;
  ctx.save();
  const night = world.index === 0 ? 0.80 : world.index === 1 ? 0.76 : 0.66;
  if (!lightCanvas) lightCanvas = document.createElement('canvas');
  if (lightCanvas.width !== Game.vw || lightCanvas.height !== Game.vh) {
    lightCanvas.width = Game.vw; lightCanvas.height = Game.vh;
  }
  const lc = lightCanvas.getContext('2d');
  lc.setTransform(1, 0, 0, 1, 0, 0);
  lc.globalCompositeOperation = 'source-over';
  lc.globalAlpha = 1;
  lc.clearRect(0, 0, Game.vw, Game.vh);
  lc.fillStyle = `rgba(2,5,12,${night})`;
  lc.fillRect(0, 0, Game.vw, Game.vh);
  lc.globalCompositeOperation = 'destination-out';

  const sx = Game.vw / 2, sy = Game.vh / 2;
  const toScreen = (x, y) => ({ x: (x - c.x) * c.zoom + sx, y: (y - c.y) * c.zoom + sy });

  const punch = (x, y, r, hard) => {
    const s = toScreen(x, y);
    const R = r * c.zoom;
    const g = lc.createRadialGradient(s.x, s.y, R * (hard ? 0.15 : 0), s.x, s.y, R);
    g.addColorStop(0, `rgba(0,0,0,${hard ? 1 : 0.95})`);
    g.addColorStop(0.55, `rgba(0,0,0,${hard ? 0.85 : 0.6})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    lc.fillStyle = g;
    lc.beginPath(); lc.arc(s.x, s.y, R, 0, TAU); lc.fill();
  };

  // player glow
  punch(p.x, p.y, 430, false);
  punch(p.x, p.y, 150, true);
  // room lamps
  for (const l of world.lamps) punch(l.x, l.y, l.r * 1.9, false);
  // mild global ambient so geometry stays readable
  lc.globalCompositeOperation = 'destination-out';
  lc.fillStyle = 'rgba(0,0,0,0.12)';
  lc.fillRect(0, 0, Game.vw, Game.vh);
  // light switches / exits glow
  for (const ex of world.exits) punch(ex.x, ex.y, 130, false);
  // guards carry flashlights
  for (const g of world.guards) {
    if (g.state === 'stunned') continue;
    const fx = g.x + Math.cos(g.angle) * 120, fy = g.y + Math.sin(g.angle) * 120;
    punch(fx, fy, 145, true);
  }
  // emergency lighting when alarm
  if (Game.alarm > 0.3) {
    lc.globalCompositeOperation = 'destination-out';
    lc.fillStyle = `rgba(0,0,0,${0.1 + Game.alarm * 0.16})`;
    lc.fillRect(0, 0, Game.vw, Game.vh);
  }

  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(lightCanvas, 0, 0);
  ctx.restore();

  // warm tint over lit areas
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  const g2 = ctx.createRadialGradient(Game.vw / 2, Game.vh / 2, 0, Game.vw / 2, Game.vh / 2, Math.max(Game.vw, Game.vh) * 0.6);
  g2.addColorStop(0, 'rgba(70,110,170,.10)');
  g2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g2;
  ctx.fillRect(0, 0, Game.vw, Game.vh);
  ctx.restore();
}

function drawVignette(ctx) {
  const g = ctx.createRadialGradient(Game.vw / 2, Game.vh / 2, Math.min(Game.vw, Game.vh) * 0.35,
    Game.vw / 2, Game.vh / 2, Math.max(Game.vw, Game.vh) * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.62)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, Game.vw, Game.vh);
}

function drawMenuBackdrop(ctx) {
  const t = performance.now() / 1000;
  const g = ctx.createLinearGradient(0, 0, Game.vw, Game.vh);
  g.addColorStop(0, '#0a1220');
  g.addColorStop(0.5, '#0b1526');
  g.addColorStop(1, '#050a12');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, Game.vw, Game.vh);

  // moving light beams (searchlights)
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 4; i++) {
    const a = t * (0.12 + i * 0.045) + i * 1.9;
    const x = Game.vw / 2 + Math.cos(a) * Game.vw * 0.42;
    const w = 120 + i * 40;
    const rg = ctx.createRadialGradient(x, -80, 0, x, -80, w * 3.4);
    rg.addColorStop(0, 'rgba(130,180,255,.14)');
    rg.addColorStop(1, 'rgba(130,180,255,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.moveTo(x - w * 0.2, -40);
    ctx.lineTo(x + w * 0.2, -40);
    ctx.lineTo(x + w * 1.9, Game.vh);
    ctx.lineTo(x - w * 1.9, Game.vh);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // bars silhouette
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.035)';
  ctx.lineWidth = 14;
  const gap = Math.max(78, Game.vw / 15);
  for (let x = -gap; x < Game.vw + gap; x += gap) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, Game.vh); ctx.stroke();
  }
  ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(0, Game.vh * 0.16); ctx.lineTo(Game.vw, Game.vh * 0.16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, Game.vh * 0.9); ctx.lineTo(Game.vw, Game.vh * 0.9); ctx.stroke();
  ctx.restore();

  // dust motes
  for (let i = 0; i < 42; i++) {
    const seed = h2(i, 3, 9);
    const x = (seed * Game.vw + t * (12 + seed * 22)) % Game.vw;
    const y = (h2(i, 7, 2) * Game.vh + Math.sin(t * 0.6 + i) * 18) % Game.vh;
    ctx.fillStyle = `rgba(180,215,255,${0.05 + h2(i, 1, 5) * 0.12})`;
    ctx.beginPath(); ctx.arc(x, y, 0.8 + h2(i, 2, 4) * 1.6, 0, TAU); ctx.fill();
  }
}

/* ============ 60-draw-entities.js ============ */
/* ============================================================
   ENTITY DRAWING
   ============================================================ */

function shadowEllipse(ctx, x, y, rx, ry, a = 0.4) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, rx);
  g.addColorStop(0, `rgba(0,0,0,${a})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1, ry / rx);
  ctx.translate(-x, -y);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, rx, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ---------------------- PLAYER ---------------------- */
function drawPlayer(ctx, p) {
  const t = Game.time;
  ctx.save();
  if (p.hidden) ctx.globalAlpha = 0.22;

  shadowEllipse(ctx, p.x, p.y + 12, 20, 8, p.hidden ? 0.12 : 0.52);

  const sp = Math.hypot(p.vx, p.vy);
  const moving = sp > 18;
  const bob = moving ? Math.sin(p.walkCycle * 2) * 1.3 : Math.sin(t * 2.2) * 0.45;
  const stepA = moving ? Math.sin(p.walkCycle * 2) : 0;

  ctx.translate(p.x, p.y + bob);
  ctx.rotate(p.angle + Math.PI / 2);
  ctx.lineJoin = 'round';

  const INK = 'rgba(4,13,22,.92)';

  // ---- legs (behind body)
  ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
  for (const side of [-1, 1]) {
    const off = side * 4.4, sw = side === -1 ? stepA : -stepA;
    ctx.fillStyle = '#13232f';
    ctx.beginPath(); ctx.roundRect(off - 2.9, 5.5 + sw * 3.4, 5.8, 8.6, 2.9);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0a131a';
    ctx.beginPath(); ctx.roundRect(off - 3.1, 11.6 + sw * 3.4, 6.2, 3.4, 1.7);
    ctx.fill();
  }

  // ---- torso: broad shoulders, tapering waist
  const bg = ctx.createLinearGradient(-11, -9, 11, 10);
  bg.addColorStop(0, '#bfe9ff');
  bg.addColorStop(0.35, '#6cc1f0');
  bg.addColorStop(0.75, '#2b7aa8');
  bg.addColorStop(1, '#14486a');
  ctx.beginPath();
  ctx.moveTo(-11, -6.5);            // left shoulder
  ctx.quadraticCurveTo(-11.4, 1, -8.2, 3.2);
  ctx.quadraticCurveTo(-8.6, 8.6, 0, 9.4);   // left hip to center back
  ctx.quadraticCurveTo(8.6, 8.6, 8.2, 3.2);
  ctx.quadraticCurveTo(11.4, 1, 11, -6.5);   // right shoulder
  ctx.quadraticCurveTo(9.4, -12.2, 0, -12.2);
  ctx.quadraticCurveTo(-9.4, -12.2, -11, -6.5);
  ctx.closePath();
  ctx.fillStyle = bg; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.1; ctx.stroke();

  // shoulder light
  ctx.fillStyle = 'rgba(220,248,255,.42)';
  ctx.beginPath(); ctx.ellipse(-6.6, -7.4, 4.4, 2.7, -0.5, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(10,42,64,.3)';
  ctx.beginPath(); ctx.ellipse(4.6, 5.2, 4.6, 3.2, 0.3, 0, TAU); ctx.fill();

  // harness strap
  ctx.strokeStyle = 'rgba(9,28,42,.85)'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(-7.6, -4.4); ctx.lineTo(5.6, 6.6); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,214,130,.9)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-2.6, 0.6); ctx.lineTo(1.4, 4.2); ctx.stroke();

  // ---- head / hood
  ctx.beginPath(); ctx.arc(0, -8.2, 5.6, 0, TAU);
  ctx.fillStyle = '#57a8d2'; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();

  // face opening
  ctx.beginPath(); ctx.arc(0, -8.6, 3.9, 0, TAU);
  ctx.fillStyle = '#eaf6ff'; ctx.fill();
  // eyes
  ctx.fillStyle = '#0f2b3a';
  ctx.beginPath(); ctx.ellipse(-1.6, -10, 0.95, 1.5, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(1.6, -10, 0.95, 1.5, 0, 0, TAU); ctx.fill();
  // mask over mouth
  ctx.fillStyle = 'rgba(120,190,225,.95)';
  ctx.beginPath(); ctx.roundRect(-2.6, -7.4, 5.2, 2.6, 1.2); ctx.fill();

  ctx.restore();

  if (p.sneak && !p.hidden) {
    ctx.save();
    ctx.globalAlpha = 0.4 + Math.sin(t * 5) * 0.14;
    ctx.strokeStyle = '#7fe6c0'; ctx.lineWidth = 1.3;
    ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.arc(p.x, p.y, 21, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  if (p.sprinting && sp > 60) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,217,160,.55)'; ctx.lineWidth = 2.6;
    const a = Math.atan2(p.vy, p.vx) + Math.PI;
    for (let i = 0; i < 2; i++) {
      ctx.globalAlpha = 0.42 - i * 0.17;
      ctx.beginPath(); ctx.arc(p.x, p.y, 19 + i * 5, a - 0.42, a + 0.42); ctx.stroke();
    }
    ctx.restore();
  }
  if (p.invuln > 0) {
    ctx.save();
    ctx.globalAlpha = 0.4 * (0.5 + Math.sin(t * 12) * 0.5);
    ctx.strokeStyle = '#9fffe0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, 23, 0, TAU); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------- GUARD ---------------------- */
function drawVisionCone(ctx, g, color, chaseColor) {
  if (g.state === 'stunned') return;
  const range = g.vision * Game.diff.sight;
  const fov = g.fov;
  const c = chaseColor || color;
  const alerted = g.state === 'chase' || g.suspicion > 0.4;
  const a = alerted ? 0.2 : 0.12;

  ctx.save();
  const grad = ctx.createRadialGradient(g.x, g.y, 10, g.x, g.y, range);
  const rgb = c === '#ff5566' || alerted ? '255,70,90' : '255,200,110';
  grad.addColorStop(0, `rgba(${rgb},${a * 1.6})`);
  grad.addColorStop(0.65, `rgba(${rgb},${a * 0.7})`);
  grad.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = grad;

  ctx.beginPath();
  ctx.moveTo(g.x, g.y);
  const steps = 20;
  for (let i = 0; i <= steps; i++) {
    const ang = g.angle - fov + (fov * 2) * (i / steps);
    // shorten rays that hit walls
    let r = range;
    const dx = Math.cos(ang), dy = Math.sin(ang);
    for (let s = 12; s < range; s += 8) {
      if (solidAtPoint(Game.world, g.x + dx * s, g.y + dy * s)) { r = s; break; }
    }
    ctx.lineTo(g.x + dx * r, g.y + dy * r);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawGuard(ctx, g) {
  const t = Game.time;
  const alert = g.state === 'chase';
  const stun = g.state === 'stunned';
  shadowEllipse(ctx, g.x, g.y + 12, 20, 8, 0.55);

  ctx.save();
  ctx.translate(g.x, g.y);
  ctx.rotate(g.angle + Math.PI / 2);
  ctx.lineJoin = 'round';
  const INK = 'rgba(4,8,16,.92)';
  const stepA = Math.sin(g.bob * 2.4);

  // legs
  ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
  for (const side of [-1, 1]) {
    const off = side * 4.4, sw = side === -1 ? stepA : -stepA;
    ctx.fillStyle = stun ? '#3a4252' : '#151922';
    ctx.beginPath(); ctx.roundRect(off - 2.9, 5.5 + sw * 3.2, 5.8, 8.6, 2.9);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#080b11';
    ctx.beginPath(); ctx.roundRect(off - 3.1, 11.6 + sw * 3.2, 6.2, 3.4, 1.7);
    ctx.fill();
  }

  // torso
  const bg = ctx.createLinearGradient(-11, -9, 11, 10);
  if (stun) { bg.addColorStop(0, '#c3ccdb'); bg.addColorStop(1, '#5a6478'); }
  else if (alert) { bg.addColorStop(0, '#ffc2c7'); bg.addColorStop(0.38, '#e8445c'); bg.addColorStop(1, '#7d1b28'); }
  else { bg.addColorStop(0, '#b8c4dd'); bg.addColorStop(0.38, '#6a7791'); bg.addColorStop(1, '#313950'); }
  const torso = () => {
    ctx.beginPath();
    ctx.moveTo(-11, -6.5);
    ctx.quadraticCurveTo(-11.4, 1, -8.2, 3.2);
    ctx.quadraticCurveTo(-8.6, 8.6, 0, 9.4);
    ctx.quadraticCurveTo(8.6, 8.6, 8.2, 3.2);
    ctx.quadraticCurveTo(11.4, 1, 11, -6.5);
    ctx.quadraticCurveTo(9.4, -12.2, 0, -12.2);
    ctx.quadraticCurveTo(-9.4, -12.2, -11, -6.5);
    ctx.closePath();
  };
  torso(); ctx.fillStyle = bg; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.1; ctx.stroke();

  // tactical vest, clipped
  ctx.save(); torso(); ctx.clip();
  ctx.fillStyle = stun ? 'rgba(70,80,96,.32)' : 'rgba(12,16,25,.5)';
  ctx.fillRect(-8.4, -5.6, 16.8, 12);
  ctx.fillStyle = alert ? 'rgba(255,120,140,.95)' : 'rgba(255,190,84,.62)';
  ctx.fillRect(-6.4, -6.6, 12.8, 1.8);
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  ctx.fillRect(-6.4, 3.4, 12.8, 1.2);
  ctx.restore();

  // shoulder highlight
  ctx.fillStyle = alert ? 'rgba(255,180,190,.5)' : 'rgba(215,228,250,.4)';
  ctx.beginPath(); ctx.ellipse(-6.6, -7.4, 4.4, 2.7, -0.5, 0, TAU); ctx.fill();

  // head
  ctx.beginPath(); ctx.arc(0, -8.2, 5.6, 0, TAU);
  ctx.fillStyle = alert ? '#ffe1e5' : '#ecd9c9'; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
  // eyes
  ctx.fillStyle = 'rgba(13,17,26,.92)';
  ctx.beginPath(); ctx.ellipse(-1.7, -9.6, 0.95, 1.45, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(1.7, -9.6, 0.95, 1.45, 0, 0, TAU); ctx.fill();

  // cap: crown covers back half of head, brim juts forward
  ctx.beginPath(); ctx.arc(0, -8.2, 5.6, Math.PI * 1.08, Math.PI * 1.92); ctx.closePath();
  ctx.fillStyle = alert ? '#a9202f' : '#1f2740'; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.fillStyle = alert ? '#d63a50' : '#33405f';
  ctx.beginPath(); ctx.ellipse(0, -13.2, 5.6, 1.9, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 1.2; ctx.stroke();

  // baton
  if (!stun) {
    ctx.save();
    ctx.translate(9.2, 1.2); ctx.rotate(alert ? -0.8 : -0.45);
    ctx.fillStyle = '#39445c';
    ctx.strokeStyle = 'rgba(4,8,16,.85)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.roundRect(-1.2, -5.6, 2.4, 10, 1.2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.roundRect(-1.2, -5.6, 0.8, 10, 0.4); ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // flashlight glow forward
  if (!stun) {
    const fx = g.x + Math.cos(g.angle) * 24, fy = g.y + Math.sin(g.angle) * 24;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const gr = ctx.createRadialGradient(fx, fy, 0, fx, fy, 38);
    gr.addColorStop(0, 'rgba(255,238,178,.26)');
    gr.addColorStop(1, 'rgba(255,238,178,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(fx, fy, 38, 0, TAU); ctx.fill();
    ctx.restore();
  }

  if (alert) {
    const sc = 1 + Math.sin(t * 10) * 0.12;
    ctx.save();
    ctx.translate(g.x, g.y - 33);
    ctx.scale(sc, sc);
    ctx.fillStyle = '#ff4d5e';
    ctx.shadowColor = 'rgba(255,60,80,.9)'; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(9, 6); ctx.lineTo(-9, 6); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('!', 0, 4);
    ctx.restore();
  } else if (g.suspicion > 0.08 || g.state === 'search') {
    ctx.save();
    ctx.globalAlpha = clamp(g.suspicion + 0.3, 0, 1);
    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 19px sans-serif'; ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,.95)'; ctx.shadowBlur = 8;
    ctx.fillText('?', g.x, g.y - 27);
    ctx.restore();
  }
  if (stun) {
    ctx.save();
    ctx.fillStyle = '#cfe8ff';
    ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('✦ ✦ ✦', g.x + Math.sin(t * 8) * 6, g.y - 29);
    ctx.restore();
  }
  if (g.hearT > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(g.hearT * 1.6, 0, 0.9);
    ctx.strokeStyle = '#7fe6ff'; ctx.lineWidth = 2;
    const rr = 19 + (1 - clamp(g.hearT / 0.3, 0, 1)) * 16;
    ctx.beginPath(); ctx.arc(g.x, g.y, rr, 0, TAU); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------- CAMERA ---------------------- */
function drawCamCone(ctx, c) {
  const world = Game.world;
  ctx.save();
  if (!world.powerOn) {
    // dead camera: faint red glow
    ctx.globalAlpha = 0.3;
  }
  const range = c.range;
  const rgb = !world.powerOn ? '90,110,130' : c.spotted ? '255,60,80' : c.alert > 0.1 ? '255,150,80' : '140,200,255';
  const a = !world.powerOn ? 0.05 : c.spotted ? 0.24 : 0.11;
  const grad = ctx.createRadialGradient(c.x, c.y, 8, c.x, c.y, range);
  grad.addColorStop(0, `rgba(${rgb},${a * 1.5})`);
  grad.addColorStop(0.7, `rgba(${rgb},${a * 0.55})`);
  grad.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(c.x, c.y);
  const steps = 18;
  for (let i = 0; i <= steps; i++) {
    const ang = c.angle - c.fov + c.fov * 2 * (i / steps);
    let r = range;
    const dx = Math.cos(ang), dy = Math.sin(ang);
    for (let s = 10; s < range; s += 8) {
      if (solidAtPoint(world, c.x + dx * s, c.y + dy * s)) { r = s; break; }
    }
    ctx.lineTo(c.x + dx * r, c.y + dy * r);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // camera body
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.beginPath(); ctx.ellipse(0, 7, 12, 5, 0, 0, TAU); ctx.fill();
  ctx.rotate(c.angle);
  ctx.fillStyle = '#33405a';
  ctx.beginPath(); ctx.roundRect(-9, -6, 15, 12, 3); ctx.fill();
  ctx.strokeStyle = 'rgba(150,190,240,.45)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#0d1420';
  ctx.beginPath(); ctx.arc(8, 0, 4.5, 0, TAU); ctx.fill();
  const lensOn = world.powerOn;
  ctx.fillStyle = lensOn ? (c.spotted ? '#ff3b52' : '#63e6a0') : '#3a4557';
  ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = lensOn ? 10 : 0;
  ctx.beginPath(); ctx.arc(8, 0, 2.2, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ---------------------- PROPS ---------------------- */
function drawLocker(ctx, l) {
  const t = Game.time;
  ctx.save();
  shadowEllipse(ctx, l.x, l.y + 13, 20, 8, 0.42);
  ctx.translate(l.x, l.y);
  const w = 28, h = 36;
  // outer case
  ctx.fillStyle = '#0d171a';
  ctx.beginPath(); ctx.roundRect(-w / 2 - 2, -h / 2 - 2, w + 4, h + 4, 5); ctx.fill();
  const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
  g.addColorStop(0, '#2b4a45');
  g.addColorStop(0.35, '#3f6a60');
  g.addColorStop(0.7, '#33564f');
  g.addColorStop(1, '#1e3532');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 4); ctx.fill();
  ctx.strokeStyle = 'rgba(165,230,210,.45)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 4); ctx.stroke();
  // door seam + vents at top
  ctx.strokeStyle = 'rgba(8,18,16,.5)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-w / 2 + 3, -h / 2 + 9); ctx.lineTo(w / 2 - 3, -h / 2 + 9); ctx.stroke();
  for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(-5, -h / 2 + 3 + i * 2.4); ctx.lineTo(5, -h / 2 + 3 + i * 2.4); ctx.stroke();
  }
  // number plate
  ctx.fillStyle = 'rgba(210,240,235,.18)';
  ctx.beginPath(); ctx.roundRect(-9, -2, 18, 8, 2); ctx.fill();
  // vents lower
  ctx.strokeStyle = 'rgba(6,14,12,.45)';
  for (let i = 0; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo(-8, 8 + i * 2.6); ctx.lineTo(8, 8 + i * 2.6); ctx.stroke();
  }
  // handle
  ctx.fillStyle = '#d9f2ea';
  ctx.beginPath(); ctx.roundRect(w / 2 - 7, -1, 2.6, 9, 1.2); ctx.fill();
  if (l.open) {
    ctx.fillStyle = 'rgba(110,230,255,.18)';
    ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 4); ctx.fill();
    ctx.strokeStyle = `rgba(120,230,255,${0.4 + Math.sin(t * 4) * 0.2})`;
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.roundRect(-w / 2 - 1, -h / 2 - 1, w + 2, h + 2, 5); ctx.stroke();
  }
  ctx.restore();
}

function drawSwitch(ctx, s) {
  ctx.save();
  shadowEllipse(ctx, s.x, s.y + 8, 13, 6, 0.35);
  ctx.translate(s.x, s.y);
  ctx.fillStyle = '#232c3d';
  ctx.beginPath(); ctx.roundRect(-10, -12, 20, 24, 4); ctx.fill();
  ctx.strokeStyle = 'rgba(140,175,220,.4)'; ctx.lineWidth = 1; ctx.stroke();
  // screen
  const on = s.on;
  ctx.fillStyle = on ? '#8fe3a0' : '#26313f';
  ctx.shadowColor = on ? 'rgba(120,255,190,.8)' : 'transparent';
  ctx.shadowBlur = on ? 10 : 0;
  ctx.beginPath(); ctx.roundRect(-6, -8, 12, 6, 2); ctx.fill();
  ctx.shadowBlur = 0;
  // lever
  ctx.fillStyle = on ? '#ffb347' : '#5a667c';
  ctx.beginPath();
  ctx.arc(0, 3 + (s.press ? 2 : 0), 3.4, 0, TAU); ctx.fill();
  ctx.restore();
  if (on) {
    const t = Game.time;
    ctx.save();
    ctx.globalAlpha = 0.45 + Math.sin(t * 4) * 0.25;
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(s.x, s.y, 16 + Math.sin(t * 4) * 2, 0, TAU); ctx.stroke();
    ctx.restore();
  }
}

function drawPickup(ctx, it, t) {
  const bob = Math.sin(t * 2.4 + it.t) * 3;
  ctx.save();
  ctx.translate(it.x, it.y + bob);
  // glow
  const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 26);
  const col = it.kind === 'card' ? '255,200,90' : '150,225,255';
  glow.addColorStop(0, `rgba(${col},.35)`);
  glow.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.fill();

  if (it.kind === 'card') {
    ctx.rotate(-0.35 + Math.sin(t * 1.6) * 0.12);
    ctx.fillStyle = '#f7c860';
    ctx.beginPath(); ctx.roundRect(-9, -6, 18, 12, 2.5); ctx.fill();
    ctx.fillStyle = '#22303f';
    ctx.beginPath(); ctx.roundRect(-8, -1, 16, 3.6, 1.5); ctx.fill();
    ctx.fillStyle = '#fff6da';
    ctx.beginPath(); ctx.roundRect(3, -4.4, 4.5, 3, 1); ctx.fill();
    ctx.strokeStyle = 'rgba(255,240,190,.9)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(-9, -6, 18, 12, 2.5); ctx.stroke();
  } else {
    ctx.rotate(Math.sin(t * 2) * 0.2);
    const g = ctx.createLinearGradient(0, -7, 0, 7);
    g.addColorStop(0, '#d7e9f5'); g.addColorStop(0.5, '#8fb4c9'); g.addColorStop(1, '#4a6b80');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(-5.5, -7.5, 11, 15, 2.5); ctx.fill();
    ctx.strokeStyle = 'rgba(220,245,255,.7)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(-5.5, -7.5, 11, 15, 2.5); ctx.stroke();
    ctx.fillStyle = 'rgba(90,200,255,.75)';
    ctx.beginPath(); ctx.roundRect(-3.5, -4, 7, 4, 1); ctx.fill();
  }
  ctx.restore();
}

function drawBox(ctx, b) {
  ctx.save();
  shadowEllipse(ctx, b.x, b.y + 12, 21, 9, 0.42);
  ctx.translate(b.x, b.y);
  const w = 30, h = 26;
  const g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
  g.addColorStop(0, '#6b5033'); g.addColorStop(0.5, '#55402a'); g.addColorStop(1, '#3a2b1c');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 3); ctx.fill();
  // plank lines
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.2;
  for (let i = 1; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(-w / 2 + 2, -h / 2 + i * h / 3); ctx.lineTo(w / 2 - 2, -h / 2 + i * h / 3); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,220,170,.18)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 3); ctx.stroke();
  // top sheen
  ctx.fillStyle = 'rgba(255,235,190,.09)';
  ctx.beginPath(); ctx.roundRect(-w / 2 + 2, -h / 2 + 2, w - 4, 7, 2); ctx.fill();
  // hazard mark
  if (b.v > 0.55) {
    ctx.fillStyle = 'rgba(255,180,70,.5)';
    ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('⚠', 0, 4);
    ctx.textAlign = 'left';
  }
  ctx.restore();
}

function drawDoor(ctx, d) {
  const open = d.anim;
  ctx.save();
  ctx.translate(d.cx, d.cy);
  const w = d.tileW * TILE, h = d.tileH * TILE;

  // recess / frame
  ctx.fillStyle = '#0a0f18';
  ctx.fillRect(-w / 2, -h / 2, w, h);

  const metal = (x, y, ww, hh, vertical) => {
    if (ww <= 0.5 || hh <= 0.5) return;
    const g = vertical ? ctx.createLinearGradient(x, 0, x + ww, 0) : ctx.createLinearGradient(0, y, 0, y + hh);
    g.addColorStop(0, '#8796b0');
    g.addColorStop(0.18, '#6a7a94');
    g.addColorStop(0.55, '#52627c');
    g.addColorStop(1, '#3a4860');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, ww, hh);
    // seams
    ctx.strokeStyle = 'rgba(10,14,22,.55)';
    ctx.lineWidth = 1;
    if (vertical) {
      for (let yy = y + 8; yy < y + hh - 4; yy += 11) {
        ctx.beginPath(); ctx.moveTo(x + 3, yy); ctx.lineTo(x + ww - 3, yy); ctx.stroke();
      }
    } else {
      for (let xx = x + 8; xx < x + ww - 4; xx += 11) {
        ctx.beginPath(); ctx.moveTo(xx, y + 3); ctx.lineTo(xx, y + hh - 3); ctx.stroke();
      }
    }
    // hazard band
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, ww, hh); ctx.clip();
    for (let i = -2; i < 12; i++) {
      ctx.fillStyle = 'rgba(255,186,64,.5)';
      if (vertical) ctx.fillRect(i * 14 - (open * h), y + hh - 11, 6, 5);
      else ctx.fillRect(x + i * 14 + (open * w), y + hh - 9, 6, 4);
      ctx.fillStyle = 'rgba(12,16,24,.55)';
      if (vertical) ctx.fillRect(i * 14 + 6 - (open * h), y + hh - 11, 6, 5);
      else ctx.fillRect(x + i * 14 + 6 + (open * w), y + hh - 9, 6, 4);
    }
    ctx.restore();
    // top highlight
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    if (vertical) ctx.fillRect(x, y, ww, 2); else ctx.fillRect(x, y, 2, hh);
  };

  if (d.horiz) {
    const slide = open * (w / 2 - 1);
    metal(-w / 2, -h / 2, w / 2 - slide, h, false);
    metal(slide, -h / 2, w / 2 - slide, h, false);
  } else {
    const slide = open * (h / 2 - 1);
    metal(-w / 2, -h / 2, w, h / 2 - slide, true);
    metal(-w / 2, slide, w, h / 2 - slide, true);
  }

  // light spill from opening
  if (open > 0.04) {
    const grd = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
    grd.addColorStop(0, `rgba(190,230,255,${open * 0.35})`);
    grd.addColorStop(1, `rgba(190,230,255,${open * 0.12})`);
    ctx.fillStyle = grd;
    if (d.horiz) ctx.fillRect(-w / 2 + (w / 2 - open * (w / 2 - 1)), -h / 2, 2 * open * (w / 2 - 1), h);
    else ctx.fillRect(-w / 2, -h / 2 + (h / 2 - open * (h / 2 - 1)), w, 2 * open * (h / 2 - 1));
  }

  // frame outline + status LED
  ctx.strokeStyle = 'rgba(150,185,230,.35)';
  ctx.lineWidth = 1.6;
  ctx.strokeRect(-w / 2 + 0.5, -h / 2 + 0.5, w - 1, h - 1);
  ctx.fillStyle = d.open ? '#63e6a0' : '#ffb347';
  ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(w / 2 - 6, -h / 2 + 6, 2, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawExit(ctx, ex, world) {
  const t = Game.time;
  const unlocked = Game.hasKeycard && !world.powerOn;
  ctx.save();
  ctx.translate(ex.x, ex.y);
  // glow
  const col = unlocked ? '80,255,170' : '255,90,90';
  const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 52);
  glow.addColorStop(0, `rgba(${col},${unlocked ? 0.3 + Math.sin(t * 3) * 0.08 : 0.12})`);
  glow.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0, 0, 52, 0, TAU); ctx.fill();
  // frame
  ctx.fillStyle = '#0b1119';
  ctx.beginPath(); ctx.roundRect(-20, -22, 40, 44, 4); ctx.fill();
  ctx.strokeStyle = unlocked ? 'rgba(120,255,190,.8)' : 'rgba(255,120,120,.5)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(-20, -22, 40, 44, 4); ctx.stroke();
  // bars
  ctx.strokeStyle = `rgba(${col},${unlocked ? 0.35 : 0.6})`;
  ctx.lineWidth = 2.6;
  for (let i = -1; i <= 1; i++) {
    const off = unlocked ? (i * 8 + (1 - Math.sin(t * 1.5) * 0.2) * 10) : i * 8;
    ctx.beginPath(); ctx.moveTo(off, -18); ctx.lineTo(off, 18); ctx.stroke();
  }
  // arrow sign
  ctx.fillStyle = unlocked ? 'rgba(150,255,205,.95)' : 'rgba(255,150,150,.7)';
  ctx.beginPath();
  ctx.moveTo(0, -26); ctx.lineTo(7, -33); ctx.lineTo(-7, -33);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawCan(ctx, pr) {
  ctx.save();
  ctx.translate(pr.x, pr.y);
  ctx.rotate(pr.spin);
  const g = ctx.createLinearGradient(0, -4, 0, 4);
  g.addColorStop(0, '#e2f1fb'); g.addColorStop(1, '#7fa3b8');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(-4.5, -6, 9, 12, 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.restore();
}

const $ = sel => document.querySelector(sel);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

const overlay = () => $('#overlay');
function showOverlay(html) {
  const ov = overlay();
  ov.innerHTML = '';
  const s = el('div', 'screen', html);
  ov.appendChild(s);
  ov.classList.add('show');
  return s;
}
function hideOverlay() { overlay().classList.remove('show'); overlay().innerHTML = ''; }

/* ---------------- toasts ---------------- */
const toastQueue = [];
function toast(msg, kind = 'info', dur = 2600) {
  const box = $('#toasts');
  if (!box) return;
  const t = el('div', 'toast ' + kind);
  const icons = { warn: '⚠', good: '✓', info: 'ℹ' };
  t.innerHTML = `<span style="opacity:.85">${icons[kind] || ''}</span><span>${msg}</span>`;
  box.appendChild(t);
  while (box.children.length > 3) box.removeChild(box.firstChild);
  setTimeout(() => {
    t.classList.add('out');
    setTimeout(() => t.remove(), 320);
  }, dur);
}

/* ---------------- HUD ---------------- */
function syncHud() {
  const world = Game.world;
  if (!world) return;
  $('#levelLabel').textContent = world.def.name;
  const wrap = $('#lives');
  wrap.innerHTML = '';
  const total = Game.diff.lives;
  for (let i = 0; i < total; i++) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('class', 'heart' + (i < Game.lives ? '' : ' dead'));
    svg.innerHTML = '<path fill="#ff5c6c" d="M12 21s-7.5-4.6-9.5-9A5.6 5.6 0 0 1 12 6.2 5.6 5.6 0 0 1 21.5 12c-2 4.4-9.5 9-9.5 9z"/>';
    wrap.appendChild(svg);
  }
  $('#cansCount').textContent = Game.cans;
  syncObjectives();
  updateHudDynamic();
}

function syncObjectives() {
  const list = $('#objList');
  if (!list || !Game.objectives) return;
  list.innerHTML = '';
  Game.objectives.forEach(o => {
    const d = el('div', 'obj' + (o.done ? ' done' : '') + (o.active ? ' pulse' : ''));
    d.innerHTML = `<div class="box">${o.done ? '✓' : ''}</div><div>${o.text}</div>`;
    list.appendChild(d);
  });
}

function updateHudDynamic() {
  if (!Game.world) return;
  const t = Math.floor(Game.levelTime);
  const mm = String(Math.floor(t / 60)).padStart(2, '0');
  const ss = String(t % 60).padStart(2, '0');
  const timer = $('#timer');
  if (timer) timer.textContent = `${mm}:${ss}`;

  const fill = $('#alarmFill');
  if (fill) fill.style.width = (Game.alarm * 100).toFixed(1) + '%';
  const aw = $('#alarmWrap');
  if (aw) aw.classList.toggle('hot', Game.alarm > 0.5);

  // cans chip flash when empty
  const cc = $('#cansChip');
  if (cc) cc.style.opacity = Game.cans > 0 ? '1' : '0.45';
}

/* interaction prompt */
function updatePrompt() {
  const elp = $('#prompt');
  if (!elp) return;
  const it = nearestInteractable(Game.world);
  if (!it) { elp.classList.remove('show'); return; }
  let txt = '';
  const key = Game.isTouch ? '<kbd>تعامل</kbd>' : '<kbd>E</kbd>';
  if (it.kind === 'hide') txt = `${key} پنهان شدن در کمد`;
  else if (it.kind === 'unhide') txt = `${key} بیرون آمدن از کمد`;
  else if (it.kind === 'switch') txt = `${key} قطع برق سیستم امنیتی`;
  else if (it.kind === 'exit') {
    if (!Game.hasKeycard) txt = `دروازه قفل است — کارت دسترسی لازم است`;
    else if (Game.world.powerOn) txt = `دروازه با برق قفل است — برق را قطع کن`;
    else txt = `${key} فرار از زندان!`;
  }
  elp.innerHTML = txt;
  elp.classList.add('show');
}

/* ============================================================
   TOUCH CONTROLS
   ============================================================ */
function setupTouch() {
  const stick = $('#stick'), knob = $('#stickKnob');
  let stickId = null, cx = 0, cy = 0;
  const startStick = e => {
    stickId = e.pointerId;
    const r = stick.getBoundingClientRect();
    cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    stick.setPointerCapture(e.pointerId);
    moveStick(e);
  };
  const moveStick = e => {
    if (e.pointerId !== stickId) return;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const max = 46, d = Math.hypot(dx, dy);
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    Input.touch.active = d > 6;
    Input.touch.vx = dx / max; Input.touch.vy = dy / max;
  };
  const endStick = e => {
    if (e.pointerId !== stickId) return;
    stickId = null;
    knob.style.transform = '';
    Input.touch.active = false; Input.touch.vx = Input.touch.vy = 0;
  };
  stick.addEventListener('pointerdown', startStick);
  stick.addEventListener('pointermove', moveStick);
  stick.addEventListener('pointerup', endStick);
  stick.addEventListener('pointercancel', endStick);

  $('#btnInteract').addEventListener('pointerdown', e => { e.preventDefault(); doInteract(); });
  $('#btnThrow').addEventListener('pointerdown', e => { e.preventDefault(); throwCan(); });
  const bs = $('#btnSneak');
  bs.addEventListener('pointerdown', e => { e.preventDefault(); Game.touchSneak = !Game.touchSneak; bs.style.background = Game.touchSneak ? 'rgba(120,255,200,.3)' : ''; });
}

/* ============ 80-main.js ============ */
/* ============================================================
   BOOT / LOOP
   ============================================================ */
function boot() {
  setupCanvases();
  Input.init(Game.canvas);
  setupTouch();
  applyDifficulty();
  Game.best = loadBest();
  Game.isTouch = matchMedia('(pointer:coarse)').matches || innerWidth < 820;

  // buttons
  $('#btnPause').addEventListener('click', () => {
    if (Game.state === 'playing') { Game.state = 'paused'; showPause(); }
  });
  const mb = $('#btnMute');
  mb.addEventListener('click', () => {
    SFX.init(); SFX.resume();
    SFX.setMuted(!SFX.muted);
    mb.textContent = SFX.muted ? '✕' : '♪';
    mb.style.opacity = SFX.muted ? '.5' : '1';
  });

  Game.canvas.addEventListener('click', e => {
    if (Game.state === 'playing') { SFX.init(); SFX.resume(); throwCan(); }
  });

  // pause via Esc
  addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (Game.state === 'playing') { Game.state = 'paused'; showPause(); }
      else if (Game.state === 'paused') { hideOverlay(); Game.state = 'playing'; }
    }
    if (e.key.toLowerCase() === 'e' && Game.state === 'playing') doInteract();
    if (e.key.toLowerCase() === 'f' && Game.state === 'playing') throwCan();
    if (e.key.toLowerCase() === 'm') { SFX.init(); SFX.setMuted(!SFX.muted); mb.textContent = SFX.muted ? '✕' : '♪'; }
    if (e.key.toLowerCase() === 'p' && Game.state === 'playing') { Game.state = 'paused'; showPause(); }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && Game.state === 'playing') { Game.state = 'paused'; showPause(); }
  });

  showMenu();

  let last = performance.now();
  let acc = 0;
  const STEP = 1 / 120;
  function frame(now) {
    let dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (Game.state === 'playing' || Game.state === 'caught' || Game.state === 'levelclear' || Game.state === 'gameover') {
      acc += dt;
      let guard = 0;
      while (acc >= STEP && guard++ < 8) { update(STEP); acc -= STEP; }
    } else {
      // keep animations going on menus
      Game.time += dt;
      Game.particles.forEach(p => { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; });
      Game.particles = Game.particles.filter(p => p.life > 0);
    }
    render();
    Input.endFrame();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* expose for debugging / automation */
window.Game = Game;
window.LEVELS = LEVELS;
window.DIFFS = DIFFS;
window.__game = { Game, LEVELS, SFX, Input };

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
