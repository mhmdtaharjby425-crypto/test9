<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نئون ران | مسابقه شبانه</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d0b17;color:#faf5ff;font:16px Tahoma,Arial,sans-serif}main{max-width:1100px;margin:auto;padding:24px}header,footer,.hud{display:flex;align-items:center;justify-content:space-between;gap:12px}header{margin-bottom:20px}.brand{font:italic 900 27px Arial;letter-spacing:-1px}.brand b{color:#ff478c}.tag,.label,footer{color:#b8a9c9;font-size:12px}.tag{border:1px solid #392a4a;padding:8px 12px;border-radius:20px}.game{position:relative;overflow:hidden;border:1px solid #473451;border-radius:22px;background:#1d1229;box-shadow:0 20px 65px #0008}canvas{display:block;width:100%;height:clamp(390px,65vh,650px)}.hud{position:absolute;top:16px;inset-inline:16px;pointer-events:none}.stat{background:#130b20d9;border:1px solid #66416c;border-radius:12px;padding:9px 14px;min-width:85px;text-align:center}.stat strong{display:block;font:800 23px Arial;margin-top:3px;color:#fff}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#10091c20,#12091caa);text-align:center;padding:60px 12px 95px}.overlay[hidden]{display:none}.eyebrow{color:#ff85b4;font:700 11px Arial;letter-spacing:4px;direction:ltr}h1{font-size:clamp(38px,8vw,83px);line-height:1;margin:14px 0;text-shadow:0 0 35px #ff338c80}p{color:#f1deff;line-height:1.8;margin:0 0 20px}button{border:0;font:700 15px Tahoma;color:#19091c;background:#ff589b;border-radius:10px;padding:12px 25px;cursor:pointer;box-shadow:0 0 24px #ff489456}button:focus-visible{outline:3px solid white;outline-offset:3px}.controls{position:absolute;bottom:13px;inset-inline:15px;display:flex;justify-content:space-between;direction:ltr;pointer-events:none}.controls button{pointer-events:auto;background:#1b1029e8;color:#fff;border:1px solid #855482;box-shadow:none;padding:10px 16px;touch-action:none}.controls span{display:flex;gap:6px}footer{margin-top:16px;flex-wrap:wrap}kbd{display:inline-block;background:#231932;padding:4px 7px;border-radius:4px;color:white;direction:ltr}@media(max-width:500px){main{padding:12px}.stat{min-width:70px;padding:6px}.tag{font-size:10px}}
</style><main><header><div class="brand" dir="ltr">NEON<b>RUN</b></div><div class="tag">● مسابقهٔ شبانه</div></header><section class="game" aria-label="بازی ماشین‌سواری"><canvas id="road"></canvas><div class="hud"><div class="stat"><div class="label">سرعت · km/h</div><strong id="speed">۰</strong></div><div class="stat"><div class="label">مسافت · متر</div><strong id="score">۰</strong></div><div class="stat"><div class="label">رکورد · متر</div><strong id="best">۰</strong></div></div><div class="overlay" id="overlay"><div><div class="eyebrow">MIDNIGHT HIGHWAY</div><h1 id="title">نئون ران</h1><p id="message">در بزرگراه نئونی از ماشین‌ها جاخالی بده و رکورد بزن.</p><button id="start">شروع مسابقه ←</button></div></div><div class="controls"><span><button data-key="ArrowLeft" aria-label="چپ">←</button><button data-key="ArrowRight" aria-label="راست">→</button></span><span><button data-key="ArrowDown" aria-label="ترمز">ترمز</button><button data-key="ArrowUp" aria-label="گاز">گاز</button></span></div></section><footer><span>فرمان <kbd>← →</kbd> گاز و ترمز <kbd>↑ ↓</kbd> مکث <kbd>P</kbd></span><span>نئون ران / بزرگراه نیمه‌شب</span></footer></main><script>
const $=id=>document.getElementById(id),canvas=$('road'),c=canvas.getContext('2d'),keys=new Set();let w,h,mode='ready',speed=0,dist=0,best=0,x=0,traffic=[],spawn=0,last=0;try{best=+localStorage.neonBest||0}catch{}const fa=n=>Math.floor(n).toLocaleString('fa-IR');$('best').textContent=fa(best);
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=w*d;canvas.height=h*d;c.setTransform(d,0,0,d,0,0)}new ResizeObserver(resize).observe(canvas);resize();
function poly(color,...p){c.fillStyle=color;c.beginPath();c.moveTo(...p[0]);for(const q of p.slice(1))c.lineTo(...q);c.closePath();c.fill()}
function box(color,x,y,w,h){c.fillStyle=color;c.fillRect(x,y,w,h)}
function car(cx,y,s,color){const p=(a,b)=>[cx+a*s,y+b*s];poly('#080611aa',p(-52,2),p(52,2),p(64,10),p(-64,10));box('#0b0913',cx-43*s,y-19*s,16*s,22*s);box('#0b0913',cx+27*s,y-19*s,16*s,22*s);poly(color,p(-49,-8),p(-46,-28),p(-29,-49),p(27,-49),p(46,-28),p(49,-8),p(39,-2),p(-39,-2));poly('#221332',p(-33,-28),p(-23,-44),p(22,-44),p(33,-28));poly('#91629d',p(-23,-44),p(22,-44),p(26,-39),p(-26,-39));box('#231328',cx-44*s,y-24*s,88*s,14*s);c.shadowColor='#ff287b';c.shadowBlur=12*s;box('#ff5a94',cx-42*s,y-22*s,25*s,5*s);box('#ff5a94',cx+17*s,y-22*s,25*s,5*s);c.shadowBlur=0;box('#fbd5a9',cx-8*s,y-15*s,16*s,5*s)}
const rnd=i=>{let v=Math.sin(i*127.1+91.7)*43758.5453;return v-Math.floor(v)};
function draw(){const hy=h*.48,R=w*.46,Y=t=>hy+(h-hy)*t,X=(a,t)=>w/2+a*(13+R*t);let sky=c.createLinearGradient(0,0,0,hy);sky.addColorStop(0,'#140d2d');sky.addColorStop(.65,'#512457');sky.addColorStop(1,'#bc507b');box(sky,0,0,w,h);for(let i=0;i<95;i++)box(i%7?'#e7b3ee66':'#fff1df',rnd(i)*w,rnd(i+120)*hy*.92,i%7?1:2,1);let r=Math.min(w*.12,h*.19),sy=hy*.76;let sun=c.createLinearGradient(0,sy-r,0,sy+r);sun.addColorStop(0,'#ffce94');sun.addColorStop(1,'#ff448d');c.save();c.beginPath();c.arc(w/2,sy,r,0,7);c.clip();box(sun,w/2-r,sy-r,r*2,r*2);for(let i=0;i<8;i++)box('#702950',w/2-r,sy+i*r/8,r*2,1+i*.55);c.restore();for(let i=0;i<55;i++){let bw=w/54,bh=8+rnd(i+20)*hy*.32*(.4+.6*Math.abs(i-27)/27),bx=i*bw;box(i%2?'#21142f':'#301739',bx,hy-bh,bw-1,bh);for(let j=5;j<bh-4;j+=7)if(rnd(i*21+j)>.48)box(j%2?'#ed83a57a':'#ffd79a88',bx+bw*.3,hy-bh+j,2,2)}box('#1e102b',0,hy,w,h-hy);poly('#29243b',[X(-1,0),hy],[X(1,0),hy],[X(1,1),h],[X(-1,1),h]);for(const a of [-1,1])poly('#ff508e',[X(a,0),hy],[X(a,1),h],[X(a*1.018,1),h],[X(a*1.018,0),hy]);const phase=(dist/19)%1;for(let i=0;i<20;i++){let z=(i+phase)/20,t=z*z,b=Math.min(1,(z+.027)**2);for(const a of [-1/3,1/3])poly('#dec6df',[X(a-.008,t),Y(t)],[X(a+.008,t),Y(t)],[X(a+.008,b),Y(b)],[X(a-.008,b),Y(b)]);for(const a of [-1.22,1.22]){const xx=X(a,t);box('#592951',xx,Y(t)-t*50,1+t*3,t*50);box('#ff85bd',xx-t*5,Y(t)-t*50,2+t*12,1+t*3)}}for(const o of [...traffic].sort((a,b)=>a.z-b.z)){let t=o.z**2;car(X(o.x,t),Y(t),(.1+t)*Math.min(1,w/650),o.color)}car(X(x,.89),Y(.89),Math.min(1.1,w/540),'#a452ff')}
function show(title,message,button){$('title').textContent=title;$('message').textContent=message;$('start').textContent=button;$('overlay').hidden=false}function start(){if(mode!=='paused'){speed=85;dist=0;x=0;traffic=[];spawn=.6}mode='play';$('overlay').hidden=true;$('start').blur()}$('start').onclick=start;function pause(){if(mode==='play'){mode='paused';keys.clear();show('مکث','هر وقت آماده‌ای، به بزرگراه برگرد.','ادامهٔ مسابقه')}else if(mode==='paused')start()}
function tick(time){let dt=Math.min((time-last)/1000,.04);last=time;if(mode==='play'){const held=k=>keys.has(k);speed=Math.max(55,Math.min(240,speed+(held('ArrowDown')?-110:held('ArrowUp')?80:(115-speed)*.9)*dt));dist+=speed/3.6*dt;x=Math.max(-.83,Math.min(.83,x+(Number(held('ArrowRight'))-Number(held('ArrowLeft')))*dt*1.42));spawn-=dt;if(spawn<=0){traffic.push({x:[-.65,0,.65][Math.floor(Math.random()*3)],z:.05,color:['#f95aaa','#48d8d4','#ffc164'][Math.floor(Math.random()*3)]});spawn=Math.max(.57,1.35-dist/2200)}for(const o of traffic){o.z+=dt*speed/335;if(o.z>.865&&o.z<.99&&Math.abs(o.x-x)<Math.min(.32,105/w)){mode='over';speed=0;keys.clear();if(dist>best){best=dist;try{localStorage.neonBest=Math.floor(best)}catch{}}show('پایان مسابقه',`مسافت طی‌شده: ${fa(dist)} متر`,'تلاش دوباره ←');break}}traffic=traffic.filter(o=>o.z<1.04);$('speed').textContent=fa(speed);$('score').textContent=fa(dist);$('best').textContent=fa(best)}draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')&&mode==='play'){e.preventDefault();keys.add(e.key)}if(e.code==='KeyP'&&!e.repeat)pause()});addEventListener('keyup',e=>keys.delete(e.key));addEventListener('blur',()=>{keys.clear();if(mode==='play')pause()});for(const b of document.querySelectorAll('[data-key]')){b.onpointerdown=e=>{if(mode!=='play')return;e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.key)}
</script></html>
