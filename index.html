<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#070b14" />
<title>فرار از زندان — سایه‌های شب</title>
<style>
  :root{
    --bg:#05080f;
    --panel:rgba(11,17,29,.82);
    --panel-solid:#0c1322;
    --line:rgba(126,166,226,.18);
    --txt:#e4edfb;
    --dim:#8ea3c4;
    --accent:#ffb347;
    --accent-2:#ff7a2f;
    --danger:#ff4d5e;
    --ok:#3ee2a0;
    --info:#63b8ff;
    --shadow:0 18px 50px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:"Vazirmatn","IRANSans","Segoe UI",Tahoma,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none}
  #app{position:fixed;inset:0;overflow:hidden}
  canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;background:#05080f;touch-action:none}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
       font-size:13px;text-shadow:0 2px 8px rgba(0,0,0,.8)}
  .hud-col{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
  .hud-col.right{align-items:flex-end}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
        border-radius:12px;padding:7px 11px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);white-space:nowrap}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .chip b{font-weight:700;letter-spacing:.4px}
  .mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .lives{display:flex;gap:4px;align-items:center}
  .heart{width:15px;height:15px;filter:drop-shadow(0 0 6px rgba(255,77,94,.45));transition:opacity .25s,transform .25s}
  .heart.dead{opacity:.18;transform:scale(.82)}

  .alarm-wrap{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
      border-radius:12px;padding:7px 12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .alarm-label{font-size:11px;color:var(--dim);letter-spacing:.5px}
  .alarm-bar{position:relative;width:132px;height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .alarm-bar i{position:absolute;inset:0 auto 0 0;width:0%;border-radius:99px;
      background:linear-gradient(90deg,#3ee2a0,#ffc247 55%,#ff4d5e);transition:width .12s linear}
  .alarm-wrap.hot .alarm-bar{box-shadow:0 0 16px rgba(255,77,94,.7)}
  .alarm-wrap.hot .alarm-label{color:#ff8a95}

  #objectives{position:absolute;top:76px;right:16px;width:236px;background:var(--panel);border:1px solid var(--line);
      border-radius:16px;padding:12px 13px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      pointer-events:none;font-size:12.5px;box-shadow:var(--shadow);transition:opacity .3s,transform .3s}
  #objectives .obj-title{font-size:11px;letter-spacing:1px;color:var(--dim);margin-bottom:9px;display:flex;align-items:center;gap:6px}
  #objectives .obj-title svg{opacity:.75}
  .obj{display:flex;align-items:flex-start;gap:8px;padding:4px 0;color:#c9d7ee;line-height:1.55}
  .obj.done{color:#6f829e;text-decoration:line-through;text-decoration-color:rgba(110,130,158,.6)}
  .obj .box{flex:0 0 15px;width:15px;height:15px;border-radius:5px;border:1.5px solid rgba(140,170,215,.5);margin-top:2px;
      display:grid;place-items:center;font-size:10px;transition:.2s}
  .obj.done .box{background:var(--ok);border-color:var(--ok);color:#04170f;box-shadow:0 0 12px rgba(62,226,160,.5)}
  .obj.pulse .box{animation:objPulse 1.3s infinite}
  @keyframes objPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,179,71,.5)}50%{box-shadow:0 0 0 5px rgba(255,179,71,0)}}

  /* ---------- prompt / toast ---------- */
  #prompt{position:absolute;left:50%;bottom:96px;transform:translate(-50%,12px);opacity:0;transition:.2s;
      background:rgba(9,14,24,.9);border:1px solid rgba(255,179,71,.4);color:#ffe4b8;border-radius:12px;
      padding:9px 15px;font-size:13px;display:flex;align-items:center;gap:9px;pointer-events:none;
      box-shadow:0 12px 32px rgba(0,0,0,.6);white-space:nowrap}
  #prompt.show{opacity:1;transform:translate(-50%,0)}
  kbd{background:linear-gradient(#2b3852,#1a2438);border:1px solid rgba(160,190,235,.35);border-bottom-width:2px;
      border-radius:6px;padding:1px 7px;font-family:inherit;font-size:11.5px;color:#dbe8ff}

  #toasts{position:absolute;left:50%;top:74px;transform:translateX(-50%);display:flex;flex-direction:column;
      align-items:center;gap:8px;pointer-events:none;width:min(90vw,440px)}
  .toast{background:rgba(9,14,24,.94);border:1px solid var(--line);border-radius:12px;padding:10px 16px;
      font-size:13px;box-shadow:0 14px 36px rgba(0,0,0,.6);animation:toastIn .35s cubic-bezier(.2,1.2,.3,1) both;
      display:flex;align-items:center;gap:9px;max-width:100%;text-align:center}
  .toast.warn{border-color:rgba(255,77,94,.55);color:#ffc0c6}
  .toast.good{border-color:rgba(62,226,160,.5);color:#b6ffe0}
  .toast.info{border-color:rgba(99,184,255,.45);color:#cbe8ff}
  .toast.out{animation:toastOut .3s ease forwards}
  @keyframes toastIn{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes toastOut{to{opacity:0;transform:translateY(-8px)}}

  /* ---------- overlays ---------- */
  #overlay{position:absolute;inset:0;display:none;place-items:center;padding:22px;z-index:40;
      background:radial-gradient(120% 90% at 50% 20%,rgba(10,16,28,.72),rgba(3,5,11,.94) 70%);
      backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);overflow:auto}
  #overlay.show{display:grid;animation:fadeIn .35s ease both}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .screen{width:min(720px,100%);background:linear-gradient(160deg,rgba(20,29,48,.96),rgba(9,13,23,.98));
      border:1px solid var(--line);border-radius:24px;padding:30px 30px 26px;box-shadow:0 30px 90px rgba(0,0,0,.7);
      position:relative;overflow:hidden;text-align:center;animation:pop .4s cubic-bezier(.2,1.15,.3,1) both}
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
  .screen::before{content:"";position:absolute;inset:-40% 30% auto;height:220px;
      background:radial-gradient(closest-side,rgba(255,150,60,.22),transparent);pointer-events:none}
  .eyebrow{font-size:11.5px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:10px}
  h1{font-size:clamp(28px,5vw,44px);margin:0 0 6px;line-height:1.25;
      background:linear-gradient(180deg,#fff,#b9c9e2);-webkit-background-clip:text;background-clip:text;color:transparent;
      letter-spacing:-.5px}
  h2{font-size:clamp(21px,3.6vw,30px);margin:0 0 10px;color:#f2f7ff}
  p.lead{color:#a9bbd6;font-size:14.5px;line-height:2;margin:10px auto 22px;max-width:52ch}
  .story{background:rgba(6,10,18,.62);border:1px solid var(--line);border-radius:14px;padding:14px 18px;
      color:#b8c8e2;font-size:13.5px;line-height:2;margin:14px 0 20px;text-align:right}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  button{font-family:inherit;font-size:14px;color:var(--txt);cursor:pointer;border:none;border-radius:13px;
      padding:12px 22px;background:rgba(255,255,255,.07);border:1px solid var(--line);transition:.18s;font-weight:600}
  button:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
  button:active{transform:translateY(0) scale(.985)}
  button.primary{background:linear-gradient(160deg,#ffc061,#ff7a2f);color:#231203;border-color:rgba(255,220,160,.6);
      box-shadow:0 10px 30px rgba(255,122,47,.35)}
  button.primary:hover{box-shadow:0 14px 36px rgba(255,122,47,.5);filter:brightness(1.05)}
  button.ghost{background:transparent}
  .keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px;margin:16px 0 4px;text-align:right}
  .keys div{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#a5b7d2;background:rgba(255,255,255,.035);
      border:1px solid rgba(126,166,226,.12);border-radius:10px;padding:8px 10px}
  .diff{display:flex;gap:8px;justify-content:center;margin:4px 0 2px;flex-wrap:wrap}
  .diff button{padding:10px 18px;font-size:13px;border-radius:11px;opacity:.72}
  .diff button.active{opacity:1;border-color:rgba(255,179,71,.7);background:rgba(255,179,71,.14);color:#ffd9a0;
      box-shadow:0 0 0 1px rgba(255,179,71,.25) inset}
  .stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 4px}
  .stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 18px;min-width:104px}
  .stat span{display:block;font-size:10.5px;letter-spacing:1px;color:var(--dim);margin-bottom:5px}
  .stat b{font-size:20px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
  .stars{font-size:30px;letter-spacing:8px;margin:6px 0 0;color:#ffc247;filter:drop-shadow(0 0 14px rgba(255,194,71,.55))}
  .stars .off{color:rgba(255,255,255,.13);filter:none}
  .badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#ffd9a0;background:rgba(255,179,71,.12);
      border:1px solid rgba(255,179,71,.3);padding:6px 12px;border-radius:99px;margin-bottom:14px}

  /* ---------- touch ---------- */
  #touch{position:absolute;inset:0;pointer-events:none;display:none;z-index:20}
  body.touch #touch{display:block}
  #stick{position:absolute;left:22px;bottom:26px;width:124px;height:124px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,255,255,.09),rgba(255,255,255,.03) 70%);
      border:1px solid rgba(160,195,240,.25);pointer-events:auto;touch-action:none}
  #stickKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
      background:radial-gradient(circle at 35% 30%,#ffd9a1,#ff9a45);box-shadow:0 6px 18px rgba(255,140,50,.4);opacity:.9}
  .tbtn{position:absolute;bottom:34px;width:66px;height:66px;border-radius:50%;pointer-events:auto;
      background:rgba(16,24,40,.85);border:1px solid rgba(150,185,235,.35);color:#dfe9fa;font-size:12.5px;
      display:grid;place-items:center;font-weight:700;backdrop-filter:blur(10px);touch-action:none}
  .tbtn:active{background:rgba(255,179,71,.28);border-color:rgba(255,179,71,.6)}
  #btnInteract{right:26px;bottom:104px}
  #btnThrow{right:106px;bottom:34px}
  #btnSneak{right:26px;bottom:26px;width:58px;height:58px;font-size:11px}

  @media (max-width:760px){
    #objectives{top:auto;bottom:12px;right:12px;left:auto;width:196px;font-size:11.5px;padding:10px;
      background:rgba(9,14,24,.7)}
    body.touch #objectives{bottom:12px;right:12px;width:170px}
    #hud{padding:10px;font-size:12px}
    .alarm-bar{width:84px}
    .screen{padding:22px 18px 20px;border-radius:20px}
    #prompt{bottom:170px}
  }
  @media (max-width:520px){
    #objectives{display:none}
    body.touch #objectives{display:none}
    #prompt{bottom:186px;font-size:12px;padding:8px 12px;white-space:normal;text-align:center;max-width:88vw}
  }
  /* reduce motion preference */
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-col">
      <div class="chip"><span class="dot"></span><b id="levelLabel">مقدمه</b></div>
      <div class="chip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8ea3c4" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="mono" id="timer">00:00</span></div>
    </div>

    <div class="hud-col" style="align-items:center">
      <div class="alarm-wrap" id="alarmWrap">
        <span class="alarm-label">هشدار</span>
        <div class="alarm-bar"><i id="alarmFill"></i></div>
      </div>
    </div>

    <div class="hud-col right">
      <div class="lives" id="lives"></div>
      <div style="display:flex;gap:8px">
        <div class="chip" id="cansChip" title="کنسروهای پرتابی">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffb347" stroke-width="2" stroke-linecap="round"><path d="M7 4h10M7 20h10M6 4c0 4 12 4 12 0M6 20c0-4 12-4 12 0"/><path d="M7 4v16M17 4v16"/></svg>
          <b class="mono" id="cansCount">3</b>
        </div>
        <button id="btnMute" style="padding:8px 10px;border-radius:11px;font-size:14px" title="صدا">♪</button>
        <button id="btnPause" style="padding:8px 12px;border-radius:11px;font-size:13px" title="توقف">❚❚</button>
      </div>
    </div>
  </div>

  <div id="objectives">
    <div class="obj-title">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8ea3c4" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      اهداف مأموریت
    </div>
    <div id="objList"></div>
  </div>

  <div id="prompt"></div>
  <div id="toasts"></div>

  <div id="touch">
    <div id="stick"><div id="stickKnob"></div></div>
    <div class="tbtn" id="btnInteract">تعامل</div>
    <div class="tbtn" id="btnThrow">پرتاب</div>
    <div class="tbtn" id="btnSneak">خیز</div>
  </div>

  <div id="overlay"></div>
</div>
<script>
/* ============ 00-core.js ============ */
'use strict';
/* ============================================================
   Sایه‌های شب — Prison Escape
   Core utilities, math, RNG, audio engine
   ============================================================ */

const TILE = 40;                     // world units per tile
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const norm = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
const angLerp = (a, b, t) => a + norm(b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const rand = (a = 1, b = 0) => b + Math.random() * (a - b);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// deterministic hash noise for tile decoration
function h2(x, y, s = 0) {
  let n = (x * 374761393 + y * 668265263 + s * 1442695040) | 0;
  n = (n ^ (n >> 13)) * 1274126177;
  n = n ^ (n >> 16);
  return ((n >>> 0) % 10000) / 10000;
}

/* ---------------------------- AUDIO ---------------------------- */
const SFX = {
  ctx: null, master: null, muted: false, inited: false,
  alarmNode: null, drone: null,
  init() {
    if (this.inited) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.55;
      this.master.connect(this.ctx.destination);
      this.inited = true;
      this.startAmbient();
    } catch (e) { console.warn('audio', e); }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.55, this.ctx.currentTime, 0.05);
  },
  tone(freq, dur = 0.12, type = 'sine', gain = 0.18, dest = null, slideTo = null) {
    if (!this.inited || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur = 0.2, freq = 1200, gain = 0.15, q = 1) {
    if (!this.inited || this.muted) return;
    const t = this.ctx.currentTime;
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
    const g = this.ctx.createGain(); g.gain.value = gain;
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t);
  },
  step(sprint) { this.noise(0.09, sprint ? 700 : 420, sprint ? 0.16 : 0.08, 1.2); },
  pickup() { this.tone(660, 0.1, 'triangle', 0.16); setTimeout(() => this.tone(990, 0.14, 'triangle', 0.14), 70); },
  door() { this.noise(0.32, 300, 0.16, 0.8); this.tone(120, 0.28, 'sawtooth', 0.1, null, 70); },
  locked() { this.tone(150, 0.1, 'square', 0.1); setTimeout(() => this.tone(110, 0.16, 'square', 0.09), 90); },
  switchOn() { this.noise(0.18, 900, 0.14, 2); this.tone(420, 0.3, 'sine', 0.12, null, 820); },
  throwCan() { this.noise(0.12, 2200, 0.1, 3); },
  land() { this.tone(180, 0.18, 'triangle', 0.14, null, 90); this.noise(0.14, 2600, 0.14, 4); },
  caught() {
    this.tone(320, 0.16, 'sawtooth', 0.2, null, 90);
    setTimeout(() => this.tone(220, 0.3, 'square', 0.16, null, 60), 130);
    this.noise(0.5, 220, 0.2, 0.7);
  },
  win() {
    [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 0.3, 'triangle', 0.15), i * 120));
  },
  hide() { this.noise(0.25, 500, 0.1, 0.9); },
  click() { this.tone(520, 0.045, 'triangle', 0.07); },
  alarmOn() {
    if (!this.inited || this.muted) return;
    this.tone(760, 0.18, 'square', 0.1, null, 520);
    setTimeout(() => this.tone(760, 0.18, 'square', 0.1, null, 520), 240);
    setTimeout(() => this.tone(760, 0.22, 'square', 0.1, null, 480), 480);
  },
  startAmbient() {
    if (!this.inited) return;
    const t = this.ctx.currentTime;
    const g = this.ctx.createGain(); g.gain.value = 0.05; g.connect(this.master);
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320; lp.Q.value = 0.8;
    lp.connect(g);
    [55, 82.5, 110.3].forEach((f, i) => {
      const o = this.ctx.createOscillator();
      o.type = i === 2 ? 'sine' : 'triangle'; o.frequency.value = f; o.detune.value = i * 4;
      const og = this.ctx.createGain(); og.gain.value = i === 2 ? 0.25 : 0.5;
      o.connect(og); og.connect(lp); o.start(t);
      const lfo = this.ctx.createOscillator(); lfo.frequency.value = 0.06 + i * 0.03;
      const lg = this.ctx.createGain(); lg.gain.value = 0.18;
      lfo.connect(lg); lg.connect(og.gain); lfo.start(t);
    });
    const nLen = this.ctx.sampleRate * 2;
    const nb = this.ctx.createBuffer(1, nLen, this.ctx.sampleRate);
    const nd = nb.getChannelData(0);
    for (let i = 0; i < nLen; i++) nd[i] = (Math.random() * 2 - 1) * 0.35;
    const src = this.ctx.createBufferSource(); src.buffer = nb; src.loop = true;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = 0.6;
    const ng = this.ctx.createGain(); ng.gain.value = 0.05;
    src.connect(bp); bp.connect(ng); ng.connect(this.master); src.start(t);
    this.drone = g;
  }
};

/* ---------------------------- INPUT ---------------------------- */
const Input = {
  keys: {}, justPressed: {},
  mouse: { x: 0, y: 0, active: false, down: false },
  touch: { active: false, vx: 0, vy: 0 },
  init(canvas) {
    addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
      if (!this.keys[k]) this.justPressed[k] = true;
      this.keys[k] = true;
    });
    addEventListener('keyup', e => { this.keys[e.key.toLowerCase()] = false; });
    addEventListener('blur', () => { this.keys = {}; });
    canvas.addEventListener('mousemove', e => {
      this.mouse.x = e.clientX; this.mouse.y = e.clientY; this.mouse.active = true;
    });
    canvas.addEventListener('mousedown', () => { this.mouse.down = true; });
    addEventListener('mouseup', () => { this.mouse.down = false; });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
  },
  pressed(k) { return !!this.justPressed[k]; },
  endFrame() { this.justPressed = {}; }
};

/* ============================================================
   WORLD / LEVEL BUILD
   ============================================================ */
function buildLevel(index) {
  const def = LEVELS[index];
  const rows = def.map;
  const H = rows.length, W = rows[0].length;
  const world = {
    def, index, W, H, grid: [], W2: W * TILE, H2: H * TILE,
    doors: [], lockers: [], guards: [], cameras: [], pickups: [],
    switches: [], exits: [], boxes: [], powerOn: true,
    spawn: { x: 0, y: 0 }, fogTiles: [], lamps: []
  };

  for (let y = 0; y < H; y++) {
    const row = [];
    for (let x = 0; x < W; x++) {
      row.push({ ch: rows[y][x], solid: false, type: 'floor', v: h2(x, y, index) });
    }
    world.grid.push(row);
  }

  // classify
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const t = world.grid[y][x];
      switch (t.ch) {
        case '#': t.type = 'wall'; t.solid = true; break;
        case 'T': t.type = 'box'; t.solid = true; break;
        case 'D': t.type = 'door'; t.solid = true; break;
        case 'L': t.type = 'locker'; t.solid = false; break;
        case 'C': t.type = 'floor'; break;
        case 'G': t.type = 'gate'; t.solid = true; break;
        default: t.type = 'floor';
      }
    }
  }

  // player spawn
  outer:
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (world.grid[y][x].ch === 'P') {
      world.spawn = { x: x * TILE + TILE / 2, y: y * TILE + TILE / 2 };
      break outer;
    }
  }

  // group doors
  const seenDoor = new Set();
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (world.grid[y][x].type !== 'door' || seenDoor.has(y * W + x)) continue;
    const horiz = isDoorNeighbor(world, x + 1, y);
    const cells = [];
    if (horiz) {
      let sx = x;
      while (sx - 1 >= 0 && world.grid[y][sx - 1].type === 'door') sx--;
      let ex = x;
      while (ex + 1 < W && world.grid[y][ex + 1].type === 'door') ex++;
      for (let i = sx; i <= ex; i++) { cells.push([i, y]); seenDoor.add(y * W + i); }
    } else {
      let sy = y;
      while (sy - 1 >= 0 && world.grid[sy - 1][x].type === 'door') sy--;
      let ey = y;
      while (ey + 1 < H && world.grid[ey + 1][x].type === 'door') ey++;
      for (let i = sy; i <= ey; i++) { cells.push([x, i]); seenDoor.add(i * W + x); }
    }
    const cx = cells.reduce((s, c) => s + c[0], 0) / cells.length;
    const cy = cells.reduce((s, c) => s + c[1], 0) / cells.length;
    world.doors.push({
      cells, horiz, cx: cx * TILE + TILE / 2, cy: cy * TILE + TILE / 2,
      tileW: horiz ? cells.length : 1, tileH: horiz ? 1 : cells.length,
      open: false, anim: 0, guards: 0
    });
  }

  // entities from map
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const ch = world.grid[y][x].ch;
      const px = x * TILE + TILE / 2, py = y * TILE + TILE / 2;
      if (ch === 'L') world.lockers.push({ x: px, y: py, tx: x, ty: y, open: false });
      else if (ch === 'C') world.cameras.push(makeCamera(px, py, x, y, world));
      else if (ch === 'A') world.guards.push(makeGuard(px, py, x, y, world));
      else if (ch === 'K') world.pickups.push({ x: px, y: py, kind: 'card', tx: x, ty: y, taken: false, t: rand(6.28) });
      else if (ch === 'X') world.pickups.push({ x: px, y: py, kind: 'can', tx: x, ty: y, taken: false, t: rand(6.28) });
      else if (ch === 'S') world.switches.push({ x: px, y: py, tx: x, ty: y, on: true, press: 0 });
      else if (ch === 'G') {
        // gate is drawn on the wall tile; the player escapes from the adjacent floor tile
        let sx2 = x, sy2 = y;
        let found = false;
        for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
          const nt = tileAt(world, x + dx, y + dy);
          if (nt && nt.type === 'floor' && nt.ch === '.') { sx2 = x + dx; sy2 = y + dy; found = true; break; }
        }
        world.exits.push({
          x: px, y: py, tx: x, ty: y,
          standX: sx2 * TILE + TILE / 2, standY: sy2 * TILE + TILE / 2,
          standTx: sx2, standTy: sy2, found
        });
      }
      else if (ch === 'T') world.boxes.push({ x: px, y: py, tx: x, ty: y, v: h2(x, y, 7) });
    }
  }

  // lamps for ambience
  for (let i = 0; i < 8; i++) {
    const x = 1 + Math.floor(rand(W - 2)), y = 1 + Math.floor(rand(H - 2));
    if (!world.grid[y][x].solid) world.lamps.push({ x: x * TILE + TILE / 2, y: y * TILE + TILE / 2, r: TILE * rand(3.4, 2.2), p: rand(6.28) });
  }

  // patrol routes
  world.guards.forEach((g, i) => { g.route = makeRoute(world, g, i); });
  return world;
}

function isDoorNeighbor(world, x, y) {
  return x < world.W && world.grid[y][x].type === 'door';
}

/* ---------- grid queries ---------- */
function tileAt(world, tx, ty) {
  if (tx < 0 || ty < 0 || tx >= world.W || ty >= world.H) return null;
  return world.grid[ty][tx];
}
function isSolidTile(world, tx, ty, passDoors) {
  if (tx < 0 || ty < 0 || tx >= world.W || ty >= world.H) return true;
  const t = world.grid[ty][tx];
  if (t.type === 'door') {
    if (passDoors) return false;              // guards/player push doors open
    const d = doorAt(world, tx, ty);
    return !(d && d.open);
  }
  if (t.type === 'locker' || t.type === 'exit') return false;
  return t.solid;
}
function doorAt(world, tx, ty) {
  for (const d of world.doors) for (const c of d.cells) if (c[0] === tx && c[1] === ty) return d;
  return null;
}
function solidAtPoint(world, x, y) {
  return isSolidTile(world, Math.floor(x / TILE), Math.floor(y / TILE));
}

/* line of sight — samples along segment; walls/boxes/closed doors block */
function hasLOS(world, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  const steps = Math.ceil(len / (TILE * 0.34));
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    if (solidAtPoint(world, x1 + dx * t, y1 + dy * t)) return false;
  }
  return true;
}

/* circle-vs-tile collision resolution */
function moveCircle(world, ent, dx, dy, radius) {
  const tryAxis = (nx, ny) => {
    const minX = nx - radius, maxX = nx + radius, minY = ny - radius, maxY = ny + radius;
    const tx1 = Math.floor(minX / TILE), tx2 = Math.floor(maxX / TILE);
    const ty1 = Math.floor(minY / TILE), ty2 = Math.floor(maxY / TILE);
    for (let ty = ty1; ty <= ty2; ty++) for (let tx = tx1; tx <= tx2; tx++) {
      if (isSolidTile(world, tx, ty)) return true;
    }
    return false;
  };
  if (dx) {
    if (!tryAxis(ent.x + dx, ent.y)) ent.x += dx;
  }
  if (dy) {
    if (!tryAxis(ent.x, ent.y + dy)) ent.y += dy;
  }
}

/* pick 3-5 open, well-spread tiles near the guard as patrol waypoints */
function makeRoute(world, guard, seedIdx) {
  const gx = Math.floor(guard.x / TILE), gy = Math.floor(guard.y / TILE);
  const open = [];
  for (let y = 1; y < world.H - 1; y++) {
    for (let x = 1; x < world.W - 1; x++) {
      const t = world.grid[y][x];
      if (t.solid || t.type === 'locker') continue;
      if (t.ch === 'K' || t.ch === 'X' || t.ch === 'G') continue;
      open.push([x, y]);
    }
  }
  // choose waypoints at increasing ring distances so routes cover ground
  const chosen = [];
  let attempts = 0;
  while (chosen.length < 4 && attempts < 900) {
    attempts++;
    const minR = 3 + chosen.length * 1.1, maxR = 8 + chosen.length * 2.4;
    const [x, y] = pick(open);
    const d = Math.hypot(x - gx, y - gy);
    if (d < minR || d > maxR) continue;
    if (!hasLOS(world, gx * TILE + 20, gy * TILE + 20, x * TILE + 20, y * TILE + 20)) continue;
    if (chosen.some(c => Math.hypot(c[0] - x, c[1] - y) < 2.6)) continue;
    chosen.push([x, y]);
  }
  if (!chosen.length) chosen.push([gx, gy]);
  return [{ tx: gx, ty: gy }, ...chosen.map(([tx, ty]) => ({ tx, ty }))];
}

/* ---------------- BFS pathfinding over tile grid ---------------- */
const _bfsPrev = new Int32Array(27 * 19);
function findPath(world, sx, sy, gx, gy) {
  const W = world.W, H = world.H;
  if (gx < 0 || gy < 0 || gx >= W || gy >= H) return null;
  if (isSolidTile(world, gx, gy, true)) return null;
  const start = sy * W + sx, goal = gy * W + gx;
  if (start === goal) return [];
  const q = [start];
  const seen = new Uint8Array(W * H);
  seen[start] = 1;
  _bfsPrev[start] = -1;
  let head = 0;
  while (head < q.length) {
    const cur = q[head++];
    if (cur === goal) {
      const path = [];
      let c = cur;
      while (c !== start) { path.push([c % W, Math.floor(c / W)]); c = _bfsPrev[c]; }
      return path.reverse();
    }
    const cx = cur % W, cy = Math.floor(cur / W);
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const ni = ny * W + nx;
      if (seen[ni] || isSolidTile(world, nx, ny, true)) continue;
      seen[ni] = 1; _bfsPrev[ni] = cur; q.push(ni);
    }
  }
  return null;
}

function canSee(world, viewer, target, rangeMul = 1, fovMul = 1) {
  const dx = target.x - viewer.x, dy = target.y - viewer.y;
  const d = Math.hypot(dx, dy);
  const range = viewer.vision * rangeMul;
  if (d > range) return false;
  const a = Math.atan2(dy, dx);
  const diff = Math.abs(norm(a - viewer.angle));
  const fov = viewer.fov * fovMul;
  if (d > 46 && diff > fov) return false;
  return hasLOS(world, viewer.x, viewer.y, target.x, target.y);
}
